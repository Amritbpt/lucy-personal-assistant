<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const Papa = window.Papa;

// ---- Storage shim (localStorage-backed, mimics the async storage API) ----
const storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
};

// ---- Icon shims (emoji-based, no external icon library needed) ----
function Icon({ children, size = 16, className = "" }) {
  return (
    <span className={className} style={{ fontSize: size, lineHeight: 1, display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
      {children}
    </span>
  );
}
const Bell = (p) => <Icon {...p}>🔔</Icon>;
const BookOpen = (p) => <Icon {...p}>📖</Icon>;
const Calendar = (p) => <Icon {...p}>📅</Icon>;
const MessageCircle = (p) => <Icon {...p}>💬</Icon>;
const Plus = (p) => <Icon {...p}>➕</Icon>;
const Trash2 = (p) => <Icon {...p}>🗑️</Icon>;
const Upload = (p) => <Icon {...p}>⬆️</Icon>;
const Clock = (p) => <Icon {...p}>⏰</Icon>;
const GraduationCap = (p) => <Icon {...p}>🎓</Icon>;
const Send = (p) => <Icon {...p}>📨</Icon>;
const School = (p) => <Icon {...p}>🏫</Icon>;
const BellRing = (p) => <Icon {...p}>🔔</Icon>;
const BellOff = (p) => <Icon {...p}>🔕</Icon>;
const ScanLine = (p) => <Icon {...p}>🔍</Icon>;
const Loader2 = (p) => <Icon {...p} className={(p.className || "") + " animate-spin"}>⏳</Icon>;
const X = (p) => <Icon {...p}>✕</Icon>;


const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function timeToMinutes(t) {
  if (!t) return null;
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}
function formatTime12(t) {
  if (!t) return "TBA";
  const [h, m] = t.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const hr = h % 12 === 0 ? 12 : h % 12;
  return `${hr}:${String(m).padStart(2, "0")} ${period}`;
}
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function formatDateReadable(d) {
  if (!d) return "TBA";
  const date = new Date(d + "T00:00:00");
  return date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function todayName() {
  return DAYS[new Date().getDay()];
}
function getNextClass(timetable, now) {
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  const todayIdx = now.getDay();
  for (let offset = 0; offset < 7; offset++) {
    const idx = (todayIdx + offset) % 7;
    const dayName = DAYS[idx];
    let entries = timetable.filter((e) => e.day === dayName);
    if (offset === 0) entries = entries.filter((e) => timeToMinutes(e.start) >= nowMinutes);
    entries = entries.filter((e) => e.start);
    entries.sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));
    if (entries.length > 0) return { entry: entries[0], daysAway: offset };
  }
  return null;
}

function normalizeDay(d) {
  if (!d) return null;
  const s = String(d).trim().toLowerCase();
  return DAYS.find((day) => day.toLowerCase().startsWith(s.slice(0, 3))) || null;
}
function parseJsonArray(text) {
  const cleaned = text.trim();

  // Strategy 1: the whole response is already valid JSON
  try {
    const direct = JSON.parse(cleaned);
    if (Array.isArray(direct)) return direct;
  } catch (e) {}

  // Strategy 2: strip ```json ... ``` or ``` ... ``` code fences
  const fenced = cleaned.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fenced) {
    try {
      const parsed = JSON.parse(fenced[1].trim());
      if (Array.isArray(parsed)) return parsed;
    } catch (e) {}
  }

  // Strategy 3: find the first well-formed [...] block by matching bracket depth
  const firstBracket = cleaned.indexOf("[");
  if (firstBracket !== -1) {
    let depth = 0;
    for (let i = firstBracket; i < cleaned.length; i++) {
      if (cleaned[i] === "[") depth++;
      else if (cleaned[i] === "]") {
        depth--;
        if (depth === 0) {
          const candidate = cleaned.slice(firstBracket, i + 1);
          try {
            const parsed = JSON.parse(candidate);
            if (Array.isArray(parsed)) return parsed;
          } catch (e) {}
          break;
        }
      }
    }
  }

  // Strategy 4: salvage whatever complete {...} objects exist, even if the
  // overall array got cut off (e.g. a long timetable hitting the token limit)
  const salvaged = [];
  let depth = 0;
  let objStart = -1;
  for (let i = 0; i < cleaned.length; i++) {
    const ch = cleaned[i];
    if (ch === "{") {
      if (depth === 0) objStart = i;
      depth++;
    } else if (ch === "}") {
      depth--;
      if (depth === 0 && objStart !== -1) {
        try {
          salvaged.push(JSON.parse(cleaned.slice(objStart, i + 1)));
        } catch (e) {}
        objStart = -1;
      }
    }
  }
  if (salvaged.length > 0) return salvaged;

  // All strategies failed — surface exactly what came back so the real cause is visible
  const snippet = cleaned.slice(0, 220);
  throw new Error(`The image reader didn't return usable data. It said: "${snippet}${cleaned.length > 220 ? "..." : ""}"`);
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const mediaType = dataUrl.slice(5, dataUrl.indexOf(";"));
      const base64 = dataUrl.slice(dataUrl.indexOf(",") + 1);
      resolve({ base64, mediaType });
    };
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });
}

const TIMETABLE_IMAGE_PROMPT = `This image shows a class timetable/schedule. Extract every class session into a JSON array. Each item must have exactly these fields: "day" (full weekday name: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, or Saturday), "start" (24-hour HH:MM start time, empty string if unknown), "end" (24-hour HH:MM end time, empty string if unknown), "subject" (class/subject name), "room" (room or location, empty string if unknown), "teacher" (teacher name, empty string if unknown). If the timetable has a grid layout with days as columns and time slots as rows (or vice versa), infer day and time correctly for each cell. Respond with ONLY the raw JSON array, no markdown code fences, no explanation, no extra text before or after. If the image is not a timetable or nothing can be read, respond with [].`;

function examImagePrompt() {
  const today = todayStr();
  const year = new Date().getFullYear();
  return `This image shows an exam datesheet/schedule. Extract every exam into a JSON array. Each item must have exactly these fields: "subject" (exam/subject name), "date" (YYYY-MM-DD format; if no year is printed, assume ${year} unless the month has clearly already passed this year, in which case use ${year + 1} — today's date is ${today}), "time" (24-hour HH:MM, empty string if unknown), "room" (empty string if unknown), "notes" (any extra printed detail like syllabus coverage or instructions, empty string if none). Respond with ONLY the raw JSON array, no markdown code fences, no explanation, no extra text before or after. If the image is not an exam datesheet or nothing can be read, respond with [].`;
}

async function extractFromImage(file, kind, apiKey) {
  if (!apiKey) {
    throw new Error("Add the required API key in Settings first to use this feature.");
  }
  if (file.size > 5 * 1024 * 1024) {
    throw new Error("That image is larger than 5MB — try a smaller photo or a cropped screenshot.");
  }
  const { base64, mediaType } = await fileToBase64(file);
  if (!["image/png", "image/jpeg"].includes(mediaType)) {
    throw new Error("Please upload a JPG or PNG image.");
  }
  const prompt = kind === "timetable" ? TIMETABLE_IMAGE_PROMPT : examImagePrompt();
  let response;
  try {
    response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-sonnet-5",
        max_tokens: 8000,
        messages: [
          {
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
              { type: "text", text: prompt },
            ],
          },
        ],
      }),
    });
  } catch (networkErr) {
    throw new Error("Network error reaching the image reader. Check your connection and try again.");
  }
  if (!response.ok) {
    let detail = "";
    try {
      const errBody = await response.json();
      detail = errBody?.error?.message || JSON.stringify(errBody).slice(0, 200);
    } catch (e) {
      detail = await response.text().catch(() => "");
    }
    console.error("extractFromImage failed", response.status, detail);
    throw new Error(`Image reader returned an error (${response.status}). ${detail || ""}`.trim());
  }
  const data = await response.json();
  const text = (data.content || []).map((b) => b.text || "").join("\n");
  if (!text.trim()) {
    console.error("extractFromImage: empty response", data);
    throw new Error("The image reader returned an empty response. Try again.");
  }
  try {
    return parseJsonArray(text);
  } catch (parseErr) {
    console.error("extractFromImage: could not parse JSON", text);
    throw parseErr;
  }
}

const TABS = [
  { id: "chat", label: "Assistant", icon: MessageCircle },
  { id: "timetable", label: "Timetable", icon: Calendar },
  { id: "homework", label: "Homework", icon: BookOpen },
  { id: "exams", label: "Exams", icon: GraduationCap },
];

function App() {
  const [tab, setTab] = useState("chat");
  const [timetable, setTimetable] = useState([]);
  const [homework, setHomework] = useState([]);
  const [exams, setExams] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [messages, setMessages] = useState([
    { id: genId(), sender: "bot", text: "Hey, I'm Lucy, your personal manager.", time: new Date() },
    { id: genId(), sender: "bot", text: "I'll help you manage your timetable and classes.", time: new Date() },
  ]);
  const [input, setInput] = useState("");
  const [notifPermission, setNotifPermission] = useState(
    typeof Notification !== "undefined" ? Notification.permission : "unsupported"
  );
  const [, setTick] = useState(0);
  const [toasts, setToasts] = useState([]);
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("lucy-api-key") || "");
  const [showSettings, setShowSettings] = useState(false);
  const notifiedRef = useRef(new Set());
  const chatEndRef = useRef(null);
  const fileInputRef = useRef(null);

  useEffect(() => {
    localStorage.setItem("lucy-api-key", apiKey);
  }, [apiKey]);

  // Load persisted data
  useEffect(() => {
    (async () => {
      try {
        const tt = await storage.get("classmate-timetable");
        if (tt) setTimetable(JSON.parse(tt.value));
      } catch (e) {}
      try {
        const hw = await storage.get("classmate-homework");
        if (hw) setHomework(JSON.parse(hw.value));
      } catch (e) {}
      try {
        const ex = await storage.get("classmate-exams");
        if (ex) setExams(JSON.parse(ex.value));
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    storage.set("classmate-timetable", JSON.stringify(timetable)).catch(() => {});
  }, [timetable, loaded]);
  useEffect(() => {
    if (!loaded) return;
    storage.set("classmate-homework", JSON.stringify(homework)).catch(() => {});
  }, [homework, loaded]);
  useEffect(() => {
    if (!loaded) return;
    storage.set("classmate-exams", JSON.stringify(exams)).catch(() => {});
  }, [exams, loaded]);

  // live clock tick for countdown display
  useEffect(() => {
    const id = setInterval(() => setTick((t) => t + 1), 30000);
    return () => clearInterval(id);
  }, []);

  // scroll chat to bottom
  useEffect(() => {
    chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages, tab]);

  function addBotMessage(text) {
    setMessages((prev) => [...prev, { id: genId(), sender: "bot", text, time: new Date() }]);
  }
  function fireNotification(title, body) {
    if (typeof Notification !== "undefined" && Notification.permission === "granted") {
      try { new Notification(title, { body }); } catch (e) {}
    }
  }
  function pushToast(title, body) {
    const id = genId();
    setToasts((prev) => [...prev, { id, title, body }]);
    setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 8000);
  }
  function dismissToast(id) {
    setToasts((prev) => prev.filter((t) => t.id !== id));
  }
  function alertUser(title, body, chatText) {
    addBotMessage(chatText);
    pushToast(title, body);
    fireNotification(title, body);
  }

  // reminder engine
  useEffect(() => {
    if (!loaded) return;
    function runCheck() {
      const now = new Date();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();
      const dayName = DAYS[now.getDay()];
      const today = todayStr();

      timetable.forEach((e) => {
        if (e.day !== dayName || !e.start) return;
        const diff = timeToMinutes(e.start) - nowMinutes;
        const key = `class-${e.id}-${today}`;
        if (diff <= 10 && diff >= 0 && !notifiedRef.current.has(key)) {
          notifiedRef.current.add(key);
          const when = diff <= 1 ? "now" : `in ${diff} min`;
          alertUser(
            `${e.subject} starting soon`,
            `Room ${e.room || "TBA"} • ${e.teacher || ""}`,
            `Your next class is ${e.subject} in Room ${e.room || "TBA"} with ${e.teacher || "your teacher"} — starting ${when}.`
          );
        }
      });

      homework.forEach((h) => {
        if (!h.dueDate) return;
        const key = `hw-${h.id}-${today}`;
        if (h.dueDate === today && !notifiedRef.current.has(key)) {
          notifiedRef.current.add(key);
          alertUser(
            "Homework due today",
            `${h.subject}: ${h.description}`,
            `Reminder: ${h.subject} homework — "${h.description}" is due today.`
          );
        }
      });

      exams.forEach((ex) => {
        if (!ex.date) return;
        const examDate = new Date(ex.date + "T00:00:00");
        const diffDays = Math.round((examDate - new Date(today + "T00:00:00")) / 86400000);
        const key = `exam-${ex.id}-${today}`;
        if (diffDays >= 0 && diffDays <= 3 && !notifiedRef.current.has(key)) {
          notifiedRef.current.add(key);
          const when = diffDays === 0 ? "today" : diffDays === 1 ? "tomorrow" : `in ${diffDays} days`;
          alertUser(
            `Upcoming exam: ${ex.subject}`,
            `${when} • Room ${ex.room || "TBA"}`,
            `Exam alert: ${ex.subject} exam is ${when} (${formatDateReadable(ex.date)}) in Room ${ex.room || "TBA"}.`
          );
        }
      });
    }
    runCheck();
    const id = setInterval(runCheck, 20000);
    return () => clearInterval(id);
  }, [timetable, homework, exams, loaded]);

  function requestNotifPermission() {
    if (typeof Notification === "undefined") return;
    Notification.requestPermission().then((p) => setNotifPermission(p));
  }

  function nextClassSummary() {
    const next = getNextClass(timetable, new Date());
    if (!next) return "You don't have any classes on your timetable yet. Add some in the Timetable tab.";
    const { entry, daysAway } = next;
    if (daysAway === 0) {
      const mins = timeToMinutes(entry.start) - (new Date().getHours() * 60 + new Date().getMinutes());
      return `Your next class is ${entry.subject} in Room ${entry.room || "TBA"} with ${entry.teacher || "your teacher"}, starting at ${formatTime12(entry.start)} (in ${mins} min).`;
    }
    return `Your next class is ${entry.subject} on ${entry.day} at ${formatTime12(entry.start)} in Room ${entry.room || "TBA"} with ${entry.teacher || "your teacher"}.`;
  }

  function getBotResponse(raw) {
    const text = raw.toLowerCase();
    if (text.includes("next class") || text.includes("next lecture") || text.includes("upcoming class") || text.includes("what next")) {
      return nextClassSummary();
    }
    if (text.includes("homework")) {
      const today = todayStr();
      const pending = [...homework].filter((h) => !h.dueDate || h.dueDate >= today).sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
      if (pending.length === 0) return "You're all caught up — no pending homework logged.";
      return "Here's what's pending:\n" + pending.slice(0, 6).map((h) => `• ${h.subject}: ${h.description} (due ${formatDateReadable(h.dueDate)})`).join("\n");
    }
    if (text.includes("exam") || text.includes("datesheet") || text.includes("test")) {
      const today = todayStr();
      const upcoming = [...exams].filter((e) => !e.date || e.date >= today).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
      if (upcoming.length === 0) return "No exams on your datesheet yet. Add them in the Exams tab.";
      return "Upcoming exams:\n" + upcoming.slice(0, 6).map((e) => `• ${e.subject} — ${formatDateReadable(e.date)} at ${formatTime12(e.time)}, Room ${e.room || "TBA"}`).join("\n");
    }
    const mentionedDay = DAYS.find((d) => text.includes(d.toLowerCase()));
    const targetDay = mentionedDay || (text.includes("today") ? todayName() : null);
    if (targetDay) {
      const dayClasses = timetable.filter((e) => e.day === targetDay && e.start).sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));
      if (dayClasses.length === 0) {
        return `No information available for this day.\n\n${nextClassSummary()}`;
      }
      const label = targetDay === todayName() ? `${targetDay} (today)` : targetDay;
      return `Here's what's on ${label}:\n` + dayClasses.map((e) => `• ${formatTime12(e.start)} — ${e.subject} in Room ${e.room || "TBA"} (${e.teacher || "—"})`).join("\n");
    }
    return "I can tell you about your next class, a specific day's schedule, pending homework, or upcoming exams. Just ask!";
  }

  function handleSend(text) {
    const trimmed = (text ?? input).trim();
    if (!trimmed) return;
    setMessages((prev) => [...prev, { id: genId(), sender: "user", text: trimmed, time: new Date() }]);
    setInput("");
    setTimeout(() => {
      setMessages((prev) => [...prev, { id: genId(), sender: "bot", text: getBotResponse(trimmed), time: new Date() }]);
    }, 450);
  }

  function handleCsvUpload(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      Papa.parse(ev.target.result, {
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          const newEntries = results.data
            .map((row) => {
              const norm = {};
              Object.keys(row).forEach((k) => (norm[k.trim().toLowerCase()] = row[k]?.trim?.() ?? row[k]));
              const day = DAYS.find((d) => d.toLowerCase() === (norm.day || "").toLowerCase());
              if (!day || !norm.subject) return null;
              return {
                id: genId(),
                day,
                start: norm.start || "",
                end: norm.end || "",
                subject: norm.subject,
                room: norm.room || "",
                teacher: norm.teacher || "",
              };
            })
            .filter(Boolean);
          if (newEntries.length > 0) {
            setTimetable((prev) => [...prev, ...newEntries]);
            addBotMessage(`Imported ${newEntries.length} class${newEntries.length > 1 ? "es" : ""} from your CSV.`);
            setTab("timetable");
          } else {
            addBotMessage("I couldn't find valid rows in that CSV. Make sure it has columns: day, start, end, subject, room, teacher.");
          }
        },
      });
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  const nextClassInfo = loaded ? getNextClass(timetable, new Date()) : null;

  return (
    <div style={{ fontFamily: "'Inter', ui-sans-serif, system-ui" }} className="min-h-screen w-full flex bg-stone-50 text-slate-800">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .font-mono-c { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        @keyframes toast-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
        .toast-anim { animation: toast-in 0.25s ease-out; }
      `}</style>

      {/* Alert toasts */}
      <div className="fixed top-4 right-4 z-50 flex flex-col gap-2 w-72 max-w-[85vw]">
        {toasts.map((t) => (
          <div key={t.id} className="toast-anim bg-slate-900 text-white rounded-xl shadow-lg px-4 py-3 flex items-start gap-2">
            <BellRing size={16} className="text-amber-400 shrink-0 mt-0.5" />
            <div className="flex-1 min-w-0">
              <p className="text-sm font-semibold truncate">{t.title}</p>
              {t.body && <p className="text-xs text-slate-300 mt-0.5">{t.body}</p>}
            </div>
            <button onClick={() => dismissToast(t.id)} className="text-slate-400 hover:text-white shrink-0"><X size={14} /></button>
          </div>
        ))}
      </div>

      {/* Sidebar */}
      <div className="w-16 md:w-56 bg-slate-900 text-slate-200 flex flex-col shrink-0">
        <div className="flex items-center gap-2 px-3 md:px-5 py-5 border-b border-slate-800">
          <School size={22} className="text-amber-400 shrink-0" />
          <span className="font-display font-bold text-lg text-white hidden md:inline">Lucy</span>
        </div>
        <nav className="flex flex-col gap-1 p-2 md:p-3">
          {TABS.map((t) => {
            const Icon = t.icon;
            const active = tab === t.id;
            return (
              <button
                key={t.id}
                onClick={() => setTab(t.id)}
                className={`flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition ${
                  active ? "bg-amber-400 text-slate-900 font-semibold" : "hover:bg-slate-800 text-slate-300"
                }`}
              >
                <Icon size={18} className="shrink-0" />
                <span className="hidden md:inline">{t.label}</span>
              </button>
            );
          })}
        </nav>

const GEMINI_TIMETABLE_MODEL = "gemini-3.5-flash-lite";
const GEMINI_TIMETABLE_FALLBACK = "gemini-3.6-flash";
const GEMINI_TIMETABLE_TIMEOUT = 75000;

const GEMINI_DISCOVERY_SCHEMA = {
  type: "object",
  properties: {
    classes: {
      type: "array",
      items: {
        type: "object",
        properties: {
          class_name: { type: "string" },
          section: { type: "string" },
          page: { type: "integer" },
          description: { type: "string" }
        },
        required: ["class_name", "section", "page", "description"]
      }
    }
  },
  required: ["classes"]
};

const GEMINI_TIMETABLE_SCHEMA = {
  type: "object",
  properties: {
    class_name: { type: "string" },
    section: { type: "string" },
    entries: {
      type: "array",
      items: {
        type: "object",
        properties: {
          day: { type: "string" },
          start: { type: "string" },
          end: { type: "string" },
          subject: { type: "string" },
          room: { type: "string" },
          teacher: { type: "string" },
          group: { type: "string" }
        },
        required: ["day", "start", "end", "subject", "room", "teacher", "group"]
      }
    }
  },
  required: ["class_name", "section", "entries"]
};

function geminiTimetableFilePart(file) {
  return new Promise((resolve, reject) => {
    if (!["application/pdf", "image/jpeg", "image/png", "image/webp"].includes(file.type)) {
      reject(new Error("Please upload a PDF, JPG, PNG, or WEBP timetable."));
      return;
    }
    if (file.size > 18 * 1024 * 1024) {
      reject(new Error("For this browser test, keep the timetable file under 18 MB."));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const dataUrl = String(reader.result || "");
        const comma = dataUrl.indexOf(",");
        if (comma < 0) throw new Error("Could not prepare the timetable file.");
        resolve({
          inline_data: {
            mime_type: file.type,
            data: dataUrl.slice(comma + 1)
          }
        });
      } catch (e) {
        reject(e);
      }
    };
    reader.onerror = () => reject(new Error("Could not read the selected timetable file."));
    reader.readAsDataURL(file);
  });
}

async function geminiTimetableRequest(
    parts,
    schema,
    model = GEMINI_TIMETABLE_MODEL
) {
    const controller = new AbortController();

    const timer = setTimeout(
        () => controller.abort(),
        GEMINI_TIMETABLE_TIMEOUT
    );

    try {
        const response = await fetch(
            "https://lucy-gemini-api.amritranabpt.workers.dev/",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    model: model,

                    contents: [
                        {
                            role: "user",
                            parts: parts
                        }
                    ],

                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: schema,
                        maxOutputTokens: 24000,
                        thinkingConfig: {
                            thinkingLevel: "minimal"
                        }
                    }
                }),

                signal: controller.signal
            }
        );

        const raw = await response.text();

        let data;

        try {
            data = JSON.parse(raw);
        } catch {
            throw new Error(
                "Gemini proxy returned an invalid response."
            );
        }

        if (!response.ok) {
            throw new Error(
                data?.error?.message ||
                data?.message ||
                `Gemini request failed (${response.status}).`
            );
        }

        const output =
            data?.candidates?.[0]?.content?.parts
                ?.map((p) => p.text || "")
                .join("") || "";

        if (!output) {
            throw new Error(
                "Gemini returned no timetable data."
            );
        }

        try {
            return JSON.parse(output);
        } catch {
            throw new Error(
                "Gemini returned invalid JSON. Please try the timetable again."
            );
        }

    } catch (e) {

        if (e?.name === "AbortError") {
            throw new Error(
                "Gemini took longer than 75 seconds. Try the original PDF or a smaller clear timetable."
            );
        }

        throw e;

    } finally {
        clearTimeout(timer);
    }
}

function geminiTimetableDiscoveryPrompt() {
  return `
You are a fast timetable classifier.
Inspect the uploaded PDF/photo and identify ONLY distinct class/section timetable choices visibly printed.
Valid choices look like 3-Sec-A, 3-Sec-B, 2-Sec-A, etc.
Do not return subjects, teachers, rooms, days, or random OCR text as choices.
If a page has a course heading and section, put the course heading in class_name and the section in section.
Return the 1-based page number.
Do not invent choices. If only one timetable exists, return one choice.
Return JSON only.
`;
}

function geminiTimetableExtractionPrompt(choice) {
  return `
Extract the complete timetable for ONLY this selected timetable:
Class: ${choice.class_name}
Section: ${choice.section}
Page: ${choice.page}

Rules:
- Read the actual uploaded PDF/photo. Never use a saved or hardcoded timetable.
- Return every visible timetable cell for Monday-Friday.
- Use the actual printed start/end times.
- A physically merged cell spanning multiple time slots is ONE entry covering the full span.
- "-x-", "x", or explicitly empty/free cells become subject "FREE" with blank teacher and room.
- FREE must never be merged into a neighboring class.
- Never combine neighboring cells.
- Keep subject, teacher, room, and group separate.
- Labs, tutorials, internship, mini-project and G1/G2 activities are real entries.
- Do not guess missing information; use empty strings.
Return JSON only.
`;
}

function geminiNormalizeDay(value) {
  const s = String(value || "").trim().toLowerCase();
  return DAYS.find((d) => d.toLowerCase() === s) ||
    DAYS.find((d) => d.toLowerCase().startsWith(s.slice(0, 3))) || "";
}

function geminiNormalizeTime(value) {
  const s = String(value || "").trim().replace(/[–—−]/g, "-");
  const m = s.match(/(\d{1,2})\s*[:.]\s*(\d{2})(?:\s*(AM|PM))?/i);
  if (!m) return "";
  let h = Number(m[1]);
  const min = Number(m[2]);
  const ap = (m[3] || "").toUpperCase();
  if (ap === "PM" && h < 12) h += 12;
  if (ap === "AM" && h === 12) h = 0;
  if (h > 23 || min > 59) return "";
  return `${String(h).padStart(2, "0")}:${String(min).padStart(2, "0")}`;
}

async function discoverGeminiTimetable(filePart) {
  try {
    return await geminiTimetableRequest(
      [filePart, { text: geminiTimetableDiscoveryPrompt() }],
      GEMINI_DISCOVERY_SCHEMA
    );
  } catch (e) {
    if (/404|not found|model/i.test(e.message || "")) {
      return await geminiTimetableRequest(
        [filePart, { text: geminiTimetableDiscoveryPrompt() }],
        GEMINI_DISCOVERY_SCHEMA,
        GEMINI_TIMETABLE_FALLBACK
      );
    }
    throw e;
  }
}

async function extractGeminiTimetable(filePart, choice) {
  try {
    return await geminiTimetableRequest(
      [filePart, { text: geminiTimetableExtractionPrompt(choice) }],
      GEMINI_TIMETABLE_SCHEMA
    );
  } catch (e) {
    if (/404|not found|model/i.test(e.message || "")) {
      return await geminiTimetableRequest(
        [filePart, { text: geminiTimetableExtractionPrompt(choice) }],
        GEMINI_TIMETABLE_SCHEMA,
        GEMINI_TIMETABLE_FALLBACK
      );
    }
    throw e;
  }
}

function TimetableTab({ timetable, setTimetable, fileInputRef, handleCsvUpload }) {
  const [form, setForm] = useState({ day: "Monday", start: "", end: "", subject: "", room: "", teacher: "" });
  const [formError, setFormError] = useState(null);
  const [preview, setPreview] = useState(null);
  const [scanning, setScanning] = useState(false);
  const [scanError, setScanError] = useState(null);
  const [importStage, setImportStage] = useState("file");
  const [selectedFile, setSelectedFile] = useState(null);
  const [filePart, setFilePart] = useState(null);
  const [choices, setChoices] = useState([]);
  const [selectedChoice, setSelectedChoice] = useState("");
  const [importInfo, setImportInfo] = useState("");

  function addEntry(e) {
    e.preventDefault();
    if (!form.subject.trim()) {
      setFormError("Add a subject name before saving this class.");
      return;
    }
    setFormError(null);
    setTimetable((prev) => [...prev, { ...form, subject: form.subject.trim(), id: genId() }]);
    setForm({ day: form.day, start: "", end: "", subject: "", room: "", teacher: "" });
  }

  function removeEntry(id) {
    setTimetable((prev) => prev.filter((e) => e.id !== id));
  }

  async function handleGeminiFile(e) {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;

    setSelectedFile(file);
    setPreview(null);
    setScanError(null);
    setImportInfo("");
    setImportStage("file");
    setChoices([]);

    setScanning(true);
    try {
      setImportInfo("Preparing the file…");
      const part = await geminiTimetableFilePart(file);
      setFilePart(part);

      setImportInfo("Gemini is identifying the class/section names…");
      const result = await discoverGeminiTimetable(part);
      const found = (result?.classes || [])
        .filter((c) => c && c.class_name)
        .map((c) => ({
          class_name: String(c.class_name).trim(),
          section: String(c.section || "").trim(),
          page: Number(c.page) || 1,
          description: String(c.description || "").trim()
        }));

      if (!found.length) {
        throw new Error("Gemini could not find a class/section timetable in this file.");
      }

      setChoices(found);
      setSelectedChoice("0");
      setImportStage("choose");
      setImportInfo(`${found.length} timetable choice${found.length === 1 ? "" : "s"} found.`);
    } catch (err) {
      setScanError(err?.message || "Could not read the timetable.");
    } finally {
      setScanning(false);
    }
  }

  async function readSelectedGeminiTimetable() {
    const choice = choices[Number(selectedChoice)];
    if (!choice || !filePart) return;

    setScanning(true);
    setScanError(null);
    setImportInfo(`Gemini is reading ${choice.class_name}${choice.section ? ` — ${choice.section}` : ""}…`);

    try {
      const result = await extractGeminiTimetable(filePart, choice);
      const rows = (result?.entries || [])
        .map((r) => ({
          id: genId(),
          include: true,
          day: geminiNormalizeDay(r.day),
          start: geminiNormalizeTime(r.start),
          end: geminiNormalizeTime(r.end),
          subject: String(r.subject || "").trim() || "FREE",
          room: String(r.room || "").trim(),
          teacher: String(r.teacher || "").trim(),
          group: String(r.group || "").trim()
        }))
        .filter((r) => r.day && r.start && r.end);

      if (!rows.length) {
        throw new Error("Gemini found the selected timetable but returned no usable classes.");
      }

      setPreview(rows);
      setImportStage("preview");
      setImportInfo(`${rows.length} timetable entries found. Check them before adding.`);
    } catch (err) {
      setScanError(err?.message || "Could not extract the selected timetable.");
    } finally {
      setScanning(false);
    }
  }

  function updatePreviewRow(i, patch) {
    setPreview((prev) => prev.map((r, idx) => (idx === i ? { ...r, ...patch } : r)));
  }

  function removePreviewRow(i) {
    setPreview((prev) => prev.filter((_, idx) => idx !== i));
  }

  function confirmPreview(mode = "add") {
    const toAdd = (preview || [])
      .filter((r) => r.include && r.day && r.subject)
      .map(({ id, include, ...rest }) => ({ ...rest, id: genId() }));

    if (!toAdd.length) {
      setScanError("There are no selected timetable rows to add.");
      return;
    }

    setTimetable((prev) => mode === "replace" ? toAdd : [...prev, ...toAdd]);
    setPreview(null);
    setImportStage("file");
    setSelectedFile(null);
    setFilePart(null);
    setChoices([]);
    setImportInfo(`Added ${toAdd.length} timetable entries.`);
    setScanError(null);
  }

  const sorted = [...timetable].sort((a, b) => {
    const di = DAYS.indexOf(a.day) - DAYS.indexOf(b.day);
    if (di !== 0) return di;
    return (timeToMinutes(a.start) ?? 9999) - (timeToMinutes(b.start) ?? 9999);
  });

  return (
    <div className="max-w-4xl mx-auto space-y-6">
      <SectionHeader icon={Calendar} title="Timetable" subtitle="Add classes manually, import CSV, or read a PDF/photo with Gemini" />

      <Card>
        <div className="flex items-center justify-between gap-3 flex-wrap mb-4">
          <div>
            <h3 className="font-display font-bold text-slate-900">🤖 Gemini timetable importer</h3>
            <p className="text-xs text-slate-500 mt-1">Upload the original PDF when possible. Gemini reads the document structure and lets you choose the class/section.</p>
          </div>
          <label className={`px-4 py-2 rounded-lg font-semibold text-sm cursor-pointer ${scanning ? "bg-slate-200 text-slate-500" : "bg-amber-400 text-slate-900 hover:bg-amber-300"}`}>
            {scanning ? "Reading…" : "📅 Upload timetable"}
            <input
              type="file"
              accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp"
              className="hidden"
              disabled={scanning}
              onChange={handleGeminiFile}
            />
          </label>
        </div>

        <div className="rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm p-3">
          Gemini is connected through Lucy's secure proxy. No Gemini API key is required here.
        </div>

        {selectedFile && (
          <div className="text-xs text-slate-500 mt-3">
            Selected: <b>{selectedFile.name}</b> · {(selectedFile.size / 1024 / 1024).toFixed(2)} MB
          </div>
        )}

        {importInfo && (
          <div className="mt-3 rounded-lg bg-blue-50 border border-blue-100 text-blue-800 text-sm p-3">{importInfo}</div>
        )}

        {scanError && (
          <div className="mt-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm p-3">{scanError}</div>
        )}

        {importStage === "choose" && choices.length > 0 && (
          <div className="mt-5 border-t border-slate-200 pt-5">
            <label className="text-xs text-slate-500">Which class/section timetable do you want?</label>
            <select
              value={selectedChoice}
              onChange={(e) => setSelectedChoice(e.target.value)}
              className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm mt-1"
            >
              {choices.map((c, i) => (
                <option key={i} value={i}>
                  {c.class_name}{c.section ? ` — ${c.section}` : ""} · page {c.page}

            </select>
            <div className="flex gap-2 mt-3">
              <button onClick={readSelectedGeminiTimetable} disabled={scanning} className="px-4 py-2 rounded-lg bg-slate-900 text-white text-sm font-semibold disabled:opacity-50">
                {scanning ? "Reading timetable…" : "Read & Add timetable"}
              </button>
              <button onClick={() => { setImportStage("file"); setChoices([]); setFilePart(null); setSelectedFile(null); }} className="px-4 py-2 rounded-lg border border-slate-300 text-sm">

            </div>
          </div>

        {importStage === "preview" && preview && (

            <div className="flex items-center justify-between gap-3 mb-3 flex-wrap">
              <div>

            </div>

            <div className="overflow-auto border border-slate-200 rounded-lg">
              <table className="w-full min-w-[900px] text-sm">
                <thead className="bg-slate-50 text-xs text-slate-500">
                  <tr>
                    <th className="p-2 text-left">Keep</th>
                    <th className="p-2 text-left">Day</th>

                    <tr key={r.id} className={r.subject.toUpperCase() === "FREE" ? "bg-slate-50" : ""}>
                      <td className="p-2"><input type="checkbox" checked={r.include} onChange={(e) => updatePreviewRow(i, { include: e.target.checked })} /></td>
                      <td className="p-2">
                        <select value={r.day} onChange={(e) => updatePreviewRow(i, { day: e.target.value })} className="border rounded px-2 py-1">
                          {DAYS.map((d) => <option key={d}>{d}</option>)}
                        </select>
                      </td>
                      <td className="p-2"><input type="time" value={r.start} onChange={(e) => updatePreviewRow(i, { start: e.target.value })} className="border rounded px-2 py-1" /></td>
                      <td className="p-2"><input type="time" value={r.end} onChange={(e) => updatePreviewRow(i, { end: e.target.value })} className="border rounded px-2 py-1" /></td>
                      <td className="p-2"><input value={r.subject} onChange={(e) => updatePreviewRow(i, { subject: e.target.value })} className="border rounded px-2 py-1 w-44" /></td>
                      <td className="p-2"><input value={r.room} onChange={(e) => updatePreviewRow(i, { room: e.target.value })} className="border rounded px-2 py-1 w-28" /></td>
                      <td className="p-2"><input value={r.teacher} onChange={(e) => updatePreviewRow(i, { teacher: e.target.value })} className="border rounded px-2 py-1 w-44" /></td>
                      <td className="p-2"><input value={r.group || ""} onChange={(e) => updatePreviewRow(i, { group: e.target.value })} className="border rounded px-2 py-1 w-20" /></td>
                      <td className="p-2"><button onClick={() => removePreviewRow(i)} className="text-red-600">✕</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div className="flex gap-2 flex-wrap mt-4">
              <button onClick={() => confirmPreview("add")} className="px-4 py-2 rounded-lg bg-slate-900 text-white text-sm font-semibold">Add to timetable</button>
              <button onClick={() => confirmPreview("replace")} className="px-4 py-2 rounded-lg bg-amber-400 text-slate-900 text-sm font-semibold">Replace timetable</button>
              <button onClick={() => { setPreview(null); setImportStage("choose"); }} className="px-4 py-2 rounded-lg border border-slate-300 text-sm">Back</button>
            </div>
          </div>
        )}
      </Card>

      <Card>
        <form onSubmit={addEntry} className="grid grid-cols-2 md:grid-cols-6 gap-2 items-end">
          <div className="col-span-2 md:col-span-1">
            <label className="text-xs text-slate-500">Day</label>
            <select value={form.day} onChange={(e) => setForm({ ...form, day: e.target.value })} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm">
              {DAYS.map((d) => <option key={d} value={d}>{d}</option>)}
            </select>
          </div>
          <div>
            <label className="text-xs text-slate-500">Start</label>
            <input type="time" value={form.start} onChange={(e) => setForm({ ...form, start: e.target.value })} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">End</label>
            <input type="time" value={form.end} onChange={(e) => setForm({ ...form, end: e.target.value })} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">Subject *</label>
            <input value={form.subject} onChange={(e) => setForm({ ...form, subject: e.target.value })} placeholder="Math" className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">Room</label>
            <input value={form.room} onChange={(e) => setForm({ ...form, room: e.target.value })} placeholder="C-309" className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">Teacher</label>
            <input value={form.teacher} onChange={(e) => setForm({ ...form, teacher: e.target.value })} placeholder="Teacher" className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
          </div>
          <div className="col-span-2 md:col-span-6 flex gap-2 items-center">
            <button type="submit" className="bg-slate-900 text-white rounded-md px-4 py-1.5 text-sm font-semibold">Add class</button>
            {formError && <span className="text-xs text-red-600">{formError}</span>}
          </div>
        </form>
      </Card>

      {timetable.length > 0 && (
        <Card>
          <SectionHeader icon={Calendar} title="Your classes" />
          <div className="space-y-2">
            {sorted.map((e) => (
              <div key={e.id} className="flex items-center gap-3 border border-slate-200 rounded-lg px-3 py-2 text-sm">
                <div className="w-20 shrink-0 font-semibold text-slate-700">{e.day}</div>
                <div className="w-28 shrink-0 font-mono-c text-slate-500">{formatTime12(e.start)}–{formatTime12(e.end)}</div>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-slate-900 truncate">{e.subject}</div>
                  <div className="text-xs text-slate-500">{e.room || "No room"} · {e.teacher || "No teacher"}{e.group ? ` · ${e.group}` : ""}</div>
                </div>
                <button onClick={() => removeEntry(e.id)} className="text-xs text-red-500 hover:text-red-700">Remove</button>
              </div>
            ))}
          </div>
        </Card>
      )}

      <Card>
        <SectionHeader icon={Upload} title="CSV import" subtitle="Optional — keep this for existing CSV workflows" />
        <label className="inline-block bg-slate-100 border border-slate-300 rounded-md px-3 py-2 text-sm cursor-pointer hover:bg-slate-200">
          Import CSV
          <input ref={fileInputRef} type="file" accept=".csv" onChange={handleCsvUpload} className="hidden" />
        </label>
      </Card>
    </div>
  );
}


function HomeworkTab({ homework, setHomework, subjects }) {
  const [form, setForm] = useState({ subject: "", description: "", dueDate: "" });

  function addEntry(e) {
    e.preventDefault();
    if (!form.subject || !form.description) return;
    setHomework((prev) => [...prev, { ...form, id: genId(), addedDate: todayStr() }]);
    setForm({ subject: "", description: "", dueDate: "" });
  }
  function removeEntry(id) {
    setHomework((prev) => prev.filter((h) => h.id !== id));
  }

  const sorted = [...homework].sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));

  return (
    <div className="max-w-2xl mx-auto space-y-6">
      <SectionHeader icon={BookOpen} title="Homework" subtitle="Log homework given in a lecture, with a due date" />

      <Card>
        <form onSubmit={addEntry} className="space-y-3">
          <div className="flex gap-2">
            <div className="flex-1">
              <label className="text-xs text-slate-500">Subject</label>
              <input
                list="subject-list"
                value={form.subject}
                onChange={(e) => setForm({ ...form, subject: e.target.value })}
                placeholder="Physics"
                className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm"
              />
              <datalist id="subject-list">{subjects.map((s) => <option key={s} value={s} />)}</datalist>
            </div>
            <div className="w-40">
              <label className="text-xs text-slate-500">Due date</label>
              <input type="date" value={form.dueDate} onChange={(e) => setForm({ ...form, dueDate: e.target.value })} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
            </div>
          </div>
          <div>
            <label className="text-xs text-slate-500">What's the homework?</label>
            <textarea value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} placeholder="Solve exercises 4.1–4.5" rows={2} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
          </div>
          <button type="submit" className="w-full bg-amber-400 text-slate-900 font-semibold rounded-md py-2 text-sm flex items-center justify-center gap-1 hover:bg-amber-300">
            <Plus size={16} /> Add homework
          </button>
        </form>
      </Card>

      <div className="space-y-2">
        {sorted.length === 0 && <p className="text-sm text-slate-400 text-center py-8">No homework logged yet.</p>}
        {sorted.map((h) => {
          const overdue = h.dueDate && h.dueDate < todayStr();
          return (
            <div key={h.id} className="flex items-start gap-3 bg-white border border-slate-200 rounded-lg px-4 py-3">
              <div className="flex-1 min-w-0">
                <p className="font-medium text-sm">{h.subject}</p>
                <p className="text-sm text-slate-600">{h.description}</p>
                <p className={`text-xs mt-1 ${overdue ? "text-rose-500" : "text-slate-400"}`}>
                  Due {formatDateReadable(h.dueDate)} {overdue && "· overdue"}
                </p>
              </div>
              <button onClick={() => removeEntry(h.id)} className="text-slate-400 hover:text-rose-500 shrink-0"><Trash2 size={16} /></button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ExamsTab({ exams, setExams, apiKey }) {
  const [form, setForm] = useState({ subject: "", date: "", time: "", room: "", notes: "" });
  const [preview, setPreview] = useState(null);
  const [scanning, setScanning] = useState(false);
  const [scanError, setScanError] = useState(null);
  const imageInputRef = useRef(null);

  function addEntry(e) {
    e.preventDefault();
    if (!form.subject || !form.date) return;
    setExams((prev) => [...prev, { ...form, id: genId() }]);
    setForm({ subject: "", date: "", time: "", room: "", notes: "" });
  }
  function removeEntry(id) {
    setExams((prev) => prev.filter((e) => e.id !== id));
  }

  async function handleImageFile(e) {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    setScanning(true);
    setScanError(null);
    setPreview(null);
    try {
      const rows = await extractFromImage(file, "exams", apiKey);
      const cleaned = rows
        .map((r) => ({
          id: genId(),
          include: true,
          subject: r.subject || "",
          date: /^\d{4}-\d{2}-\d{2}$/.test(r.date) ? r.date : "",
          time: r.time || "",
          room: r.room || "",
          notes: r.notes || "",
        }))
        .filter((r) => r.subject);
      if (cleaned.length === 0) setScanError("I couldn't find any exams in that image. Try a clearer photo, or enter them manually.");
      else setPreview(cleaned);
    } catch (err) {
      setScanError(err?.message || "Something went wrong reading that image. Try again or enter exams manually.");
    } finally {
      setScanning(false);
    }
  }
  function updatePreviewRow(i, patch) {
    setPreview((prev) => prev.map((r, idx) => (idx === i ? { ...r, ...patch } : r)));
  }
  function confirmPreview() {
    const toAdd = preview.filter((r) => r.include && r.date && r.subject).map(({ id, include, ...rest }) => ({ ...rest, id: genId() }));
    setExams((prev) => [...prev, ...toAdd]);
    setPreview(null);
  }

  const sorted = [...exams].sort((a, b) => (a.date || "").localeCompare(b.date || ""));

  return (
    <div className="max-w-2xl mx-auto space-y-6">
      <SectionHeader icon={GraduationCap} title="Exam datesheet" subtitle="Add exam dates to get reminders as they approach" />

      <Card>
        <form onSubmit={addEntry} className="grid grid-cols-2 gap-2">
          <div>
            <label className="text-xs text-slate-500">Subject</label>
            <input value={form.subject} onChange={(e) => setForm({ ...form, subject: e.target.value })} placeholder="Chemistry" className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">Room</label>
            <input value={form.room} onChange={(e) => setForm({ ...form, room: e.target.value })} placeholder="Hall A" className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">Date</label>
            <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">Time</label>
            <input type="time" value={form.time} onChange={(e) => setForm({ ...form, time: e.target.value })} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
          </div>
          <div className="col-span-2">
            <label className="text-xs text-slate-500">Notes (optional)</label>
            <input value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} placeholder="Chapters 1–5, bring calculator" className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
          </div>
          <button type="submit" className="col-span-2 bg-amber-400 text-slate-900 font-semibold rounded-md py-2 text-sm flex items-center justify-center gap-1 hover:bg-amber-300">
            <Plus size={16} /> Add exam
          </button>
        </form>
      </Card>

      <div className="flex items-center gap-3 flex-wrap">
        <button
          onClick={() => imageInputRef.current?.click()}
          disabled={scanning}
          className="flex items-center gap-2 text-sm border border-slate-300 rounded-md px-3 py-2 hover:bg-slate-100 disabled:opacity-60"
        >
          {scanning ? <Loader2 size={15} className="animate-spin" /> : <ScanLine size={15} />}
          {scanning ? "Reading image..." : "Scan datesheet photo"}
        </button>
        <input ref={imageInputRef} type="file" accept="image/png,image/jpeg" onChange={handleImageFile} className="hidden" />
        <span className="text-xs text-slate-400">Works with a photo or screenshot of a printed datesheet</span>
      </div>

      {scanError && (
        <div className="flex items-start justify-between gap-2 bg-rose-50 border border-rose-200 text-rose-600 text-sm rounded-lg px-4 py-3">
          <span>{scanError}</span>
          <button onClick={() => setScanError(null)} className="shrink-0"><X size={14} /></button>
        </div>
      )}

      {preview && preview.length > 0 && (
        <Card>
          <div className="flex items-center justify-between mb-3">
            <p className="text-sm font-medium">Found {preview.length} exam{preview.length > 1 ? "s" : ""} — check the details before adding</p>
            <button onClick={() => setPreview(null)} className="text-xs text-slate-400 hover:text-slate-600 shrink-0">Discard</button>
          </div>
          <div className="space-y-2">
            {preview.map((r, i) => (
              <div key={r.id} className="flex items-center gap-2 flex-wrap">
                <input type="checkbox" checked={r.include} onChange={() => updatePreviewRow(i, { include: !r.include })} className="shrink-0" />
                <input value={r.subject} onChange={(e) => updatePreviewRow(i, { subject: e.target.value })} placeholder="Subject" className="border border-slate-300 rounded px-1.5 py-1 text-xs flex-1 min-w-[90px]" />
                <input
                  type="date"
                  value={r.date}
                  onChange={(e) => updatePreviewRow(i, { date: e.target.value })}
                  className={`border rounded px-1.5 py-1 text-xs w-32 shrink-0 ${r.date ? "border-slate-300" : "border-rose-300"}`}
                />
                <input type="time" value={r.time} onChange={(e) => updatePreviewRow(i, { time: e.target.value })} className="border border-slate-300 rounded px-1.5 py-1 text-xs w-24 shrink-0" />
                <input value={r.room} onChange={(e) => updatePreviewRow(i, { room: e.target.value })} placeholder="Room" className="border border-slate-300 rounded px-1.5 py-1 text-xs w-20 shrink-0" />
              </div>
            ))}
          </div>
          <button onClick={confirmPreview} className="mt-3 w-full bg-amber-400 text-slate-900 font-semibold rounded-md py-2 text-sm hover:bg-amber-300">
            Add {preview.filter((r) => r.include && r.date && r.subject).length} exam{preview.filter((r) => r.include && r.date && r.subject).length === 1 ? "" : "s"}
          </button>
        </Card>
      )}

      <div className="space-y-2">
        {sorted.length === 0 && <p className="text-sm text-slate-400 text-center py-8">No exams added yet.</p>}
        {sorted.map((ex) => (
          <div key={ex.id} className="flex items-start gap-3 bg-white border border-slate-200 rounded-lg px-4 py-3">
            <div className="flex-1 min-w-0">
              <p className="font-medium text-sm">{ex.subject}</p>
              <p className="text-xs text-slate-500">{formatDateReadable(ex.date)} · {formatTime12(ex.time)} · Room {ex.room || "TBA"}</p>
              {ex.notes && <p className="text-xs text-slate-400 mt-1">{ex.notes}</p>}
            </div>
            <button onClick={() => removeEntry(ex.id)} className="text-slate-400 hover:text-rose-500 shrink-0"><Trash2 size={16} /></button>
          </div>
        ))}
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
