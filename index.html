// ---- Storage shim (localStorage-backed, mimics the async storage API) ----
const storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
};

  return (
    <span className={className} style={{ fontSize: size, lineHeight: 1, display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
      {children}
    </span>
  );
}

const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function timeToMinutes(t) {
  if (!t) return null;
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}
function formatTime12(t) {
  if (!t) return "TBA";
  const [h, m] = t.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const hr = h % 12 === 0 ? 12 : h % 12;
  return `${hr}:${String(m).padStart(2, "0")} ${period}`;
}
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function formatDateReadable(d) {
  if (!d) return "TBA";
  const date = new Date(d + "T00:00:00");
  return date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function todayName() {
  return DAYS[new Date().getDay()];
}

function examForDate(exams, dateStr) {
  return (exams || [])
    .filter((e) => String(e.date || "") === dateStr && e.subject)
    .sort((a, b) => (timeToMinutes(a.time) ?? 9999) - (timeToMinutes(b.time) ?? 9999));
}

function getPrioritySchedule(timetable, exams, now) {
  const dayName = DAYS[now.getDay()];
  const today = now.toISOString().slice(0, 10);
  const todayExams = examForDate(exams, today);

  // EXAMS HAVE PRIORITY ON AN EXAM DAY.
  // If there is an exam today, Lucy does not promote a class over it.
  if (todayExams.length) {
    const nowMinutes = now.getHours() * 60 + now.getMinutes();
    const currentExam = todayExams.find((e) => {
      const start = timeToMinutes(e.time);
      return start !== null && start <= nowMinutes && nowMinutes < start + 180;
    });
    if (currentExam) {
      return { type: "exam", entry: currentExam, daysAway: 0, todayExams };
    }

    const nextExam = todayExams.find((e) => {
      const start = timeToMinutes(e.time);
      return start !== null && start >= nowMinutes;
    });
    if (nextExam) {
      return { type: "exam", entry: nextExam, daysAway: 0, todayExams };
    }

    // Exam day is still treated as exam-priority even after the last exam.
    return { type: "exam-day", entry: todayExams[0], daysAway: 0, todayExams };
  }

  // No exam today: use the normal class schedule.
  const nextClass = getNextClass(timetable, now);
  return nextClass ? { type: "class", ...nextClass, todayExams: [] } : null;
}

function getNextClass(timetable, now) {
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  const todayIdx = now.getDay();
  for (let offset = 0; offset < 7; offset++) {
    const idx = (todayIdx + offset) % 7;
    const dayName = DAYS[idx];
    let entries = timetable.filter((e) => e.day === dayName);
    if (offset === 0) entries = entries.filter((e) => timeToMinutes(e.start) >= nowMinutes);
    entries = entries.filter((e) => e.start);
    entries.sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));
    if (entries.length > 0) return { entry: entries[0], daysAway: offset };
  }
  return null;
}

function normalizeDay(d) {
  if (!d) return null;
  const s = String(d).trim().toLowerCase();
  return DAYS.find((day) => day.toLowerCase().startsWith(s.slice(0, 3))) || null;
}
function parseJsonArray(text) {
  const cleaned = text.trim();

  // Strategy 1: the whole response is already valid JSON
  try {
    const direct = JSON.parse(cleaned);
    if (Array.isArray(direct)) return direct;
  } catch (e) {}

  // Strategy 2: strip ```json ... ``` or ``` ... ``` code fences
  const fenced = cleaned.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fenced) {
    try {
      const parsed = JSON.parse(fenced[1].trim());
      if (Array.isArray(parsed)) return parsed;
    } catch (e) {}
  }

  // Strategy 3: find the first well-formed [...] block by matching bracket depth
  const firstBracket = cleaned.indexOf("[");
  if (firstBracket !== -1) {
    let depth = 0;
    for (let i = firstBracket; i < cleaned.length; i++) {
      if (cleaned[i] === "[") depth++;
      else if (cleaned[i] === "]") {
        depth--;
        if (depth === 0) {
          const candidate = cleaned.slice(firstBracket, i + 1);
          try {
            const parsed = JSON.parse(candidate);
            if (Array.isArray(parsed)) return parsed;
          } catch (e) {}
          break;
        }
      }
    }
  }

  // Strategy 4: salvage whatever complete {...} objects exist, even if the
  // overall array got cut off (e.g. a long timetable hitting the token limit)
  const salvaged = [];
  let depth = 0;
  let objStart = -1;
  for (let i = 0; i < cleaned.length; i++) {
    const ch = cleaned[i];
    if (ch === "{") {
      if (depth === 0) objStart = i;
      depth++;
    } else if (ch === "}") {
      depth--;
      if (depth === 0 && objStart !== -1) {
        try {
          salvaged.push(JSON.parse(cleaned.slice(objStart, i + 1)));
        } catch (e) {}
        objStart = -1;
      }
    }
  }
  if (salvaged.length > 0) return salvaged;

  // All strategies failed — surface exactly what came back so the real cause is visible
  const snippet = cleaned.slice(0, 220);
  throw new Error(`The image reader didn't return usable data. It said: "${snippet}${cleaned.length > 220 ? "..." : ""}"`);
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const mediaType = dataUrl.slice(5, dataUrl.indexOf(";"));
      const base64 = dataUrl.slice(dataUrl.indexOf(",") + 1);
      resolve({ base64, mediaType });
    };
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });
}

const TIMETABLE_IMAGE_PROMPT = `This image shows a class timetable/schedule. Extract every class session into a JSON array. Each item must have exactly these fields: "day" (full weekday name: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, or Saturday), "start" (24-hour HH:MM start time, empty string if unknown), "end" (24-hour HH:MM end time, empty string if unknown), "subject" (class/subject name), "room" (room or location, empty string if unknown), "teacher" (teacher name, empty string if unknown). If the timetable has a grid layout with days as columns and time slots as rows (or vice versa), infer day and time correctly for each cell. Respond with ONLY the raw JSON array, no markdown code fences, no explanation, no extra text before or after. If the image is not a timetable or nothing can be read, respond with [].`;

function examImagePrompt() {
  const today = todayStr();
  const year = new Date().getFullYear();
  return `This image shows an exam datesheet/schedule. Extract every exam into a JSON array. Each item must have exactly these fields: "subject" (exam/subject name), "date" (YYYY-MM-DD format; if no year is printed, assume ${year} unless the month has clearly already passed this year, in which case use ${year + 1} — today's date is ${today}), "time" (24-hour HH:MM, empty string if unknown), "room" (empty string if unknown), "notes" (any extra printed detail like syllabus coverage or instructions, empty string if none). Respond with ONLY the raw JSON array, no markdown code fences, no explanation, no extra text before or after. If the image is not an exam datesheet or nothing can be read, respond with [].`;
}

async function extractFromImage(file, kind, apiKey) {
  if (!apiKey) {
    throw new Error("Add the required API key in Settings first to use this feature.");
  }
  if (file.size > 5 * 1024 * 1024) {
    throw new Error("That image is larger than 5MB — try a smaller photo or a cropped screenshot.");
  }
  const { base64, mediaType } = await fileToBase64(file);
  if (!["image/png", "image/jpeg"].includes(mediaType)) {
    throw new Error("Please upload a JPG or PNG image.");
  }
  const prompt = kind === "timetable" ? TIMETABLE_IMAGE_PROMPT : examImagePrompt();
  let response;
  try {
    response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-sonnet-5",
        max_tokens: 8000,
        messages: [
          {
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
              { type: "text", text: prompt },
            ],
          },
        ],
      }),
    });
  } catch (networkErr) {
    throw new Error("Network error reaching the image reader. Check your connection and try again.");
  }
  if (!response.ok) {
    let detail = "";
    try {
      const errBody = await response.json();
      detail = errBody?.error?.message || JSON.stringify(errBody).slice(0, 200);
    } catch (e) {
      detail = await response.text().catch(() => "");
    }
    console.error("extractFromImage failed", response.status, detail);
    throw new Error(`Image reader returned an error (${response.status}). ${detail || ""}`.trim());
  }
  const data = await response.json();
  const text = (data.content || []).map((b) => b.text || "").join("\n");
  if (!text.trim()) {
    console.error("extractFromImage: empty response", data);
    throw new Error("The image reader returned an empty response. Try again.");
  }
  try {
    return parseJsonArray(text);
  } catch (parseErr) {
    console.error("extractFromImage: could not parse JSON", text);
    throw parseErr;
  }
}

const TABS = [
  { id: "chat", label: "Assistant", icon: MessageCircle },
  { id: "timetable", label: "Timetable", icon: Calendar },
  { id: "homework", label: "Homework", icon: BookOpen },
  { id: "exams", label: "Exams", icon: GraduationCap },
];

function App() {
  const [tab, setTab] = useState("chat");
  const [timetable, setTimetable] = useState([]);
  const [homework, setHomework] = useState([]);
  const [exams, setExams] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [messages, setMessages] = useState([
    { id: genId(), sender: "bot", text: "Hey, I'm Lucy, your personal manager.", time: new Date() },
    { id: genId(), sender: "bot", text: "I'll help you manage your timetable and classes.", time: new Date() },
  ]);
  const [input, setInput] = useState("");
  const [, setTick] = useState(0);
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("lucy-api-key") || "");
  const [showSettings, setShowSettings] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const chatEndRef = useRef(null);
  const fileInputRef = useRef(null);

  useEffect(() => {
    localStorage.setItem("lucy-api-key", apiKey);
  }, [apiKey]);

  // Load persisted data
  useEffect(() => {
    (async () => {
      try {
        const tt = await storage.get("classmate-timetable");
        if (tt) setTimetable(JSON.parse(tt.value));
      } catch (e) {}
      try {
        const hw = await storage.get("classmate-homework");
        if (hw) setHomework(JSON.parse(hw.value));
      } catch (e) {}
      try {
        const ex = await storage.get("classmate-exams");
        if (ex) setExams(JSON.parse(ex.value));
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    storage.set("classmate-timetable", JSON.stringify(timetable)).catch(() => {});
  }, [timetable, loaded]);
  useEffect(() => {
    if (!loaded) return;
    storage.set("classmate-homework", JSON.stringify(homework)).catch(() => {});
  }, [homework, loaded]);
  useEffect(() => {
    if (!loaded) return;
    storage.set("classmate-exams", JSON.stringify(exams)).catch(() => {});
  }, [exams, loaded]);

  // live clock tick for countdown display
  useEffect(() => {
    const id = setInterval(() => setTick((t) => t + 1), 1000);
    return () => clearInterval(id);
  }, []);

  // Notifications: exams always win over classes on the same date.
  // This browser notification layer works while Lucy is running.
  useEffect(() => {
    if (!loaded) return;

    const timer = setInterval(() => {
      try {
        if (!("Notification" in window)) return;
        if (Notification.permission !== "granted") return;

        const now = new Date();
        const date = now.toISOString().slice(0, 10);
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        const key = `lucy-notified-${date}-${now.getHours()}-${now.getMinutes()}`;

        if (localStorage.getItem(key)) return;

        const todaysExams = examForDate(exams, date);
        const examTwoMin = todaysExams.find((e) => {
          const start = timeToMinutes(e.time);
          return start !== null && start - nowMinutes === 2;
        });

        // EXAM PRIORITY: if an exam is due in 2 minutes, notify only about it.
        if (examTwoMin) {
          new Notification("🔴 Exam starting in 2 minutes", {
            body: `${examTwoMin.subject} starts at ${formatTime12(examTwoMin.time)}${examTwoMin.room ? ` · Room ${examTwoMin.room}` : ""}.`,
            tag: `lucy-exam-${date}-${examTwoMin.time}`
          });
          localStorage.setItem(key, "exam");
          return;
        }

        // If there is any exam today, do not send class-start notifications.
        if (todaysExams.length) return;

        const todaysClasses = timetable.filter((e) => e.day === DAYS[now.getDay()] && e.start);
        const classTwoMin = todaysClasses.find((e) => {
          const start = timeToMinutes(e.start);
          return start !== null && start - nowMinutes === 2;
        });

        if (classTwoMin) {
          new Notification("🔔 Class starting in 2 minutes", {
            body: `${classTwoMin.subject} starts at ${formatTime12(classTwoMin.start)}${classTwoMin.room ? ` · Room ${classTwoMin.room}` : ""}.`,
            tag: `lucy-class-${date}-${classTwoMin.start}`
          });
          localStorage.setItem(key, "class");
        }
      } catch (_) {}
    }, 15000);

    return () => clearInterval(timer);
  }, [loaded, timetable, exams]);

  // scroll chat to bottom
  useEffect(() => {
    chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages, tab]);

  function addBotMessage(text) {
    setMessages((prev) => [...prev, { id: genId(), sender: "bot", text, time: new Date() }]);
  }
  function getLiveClassInfo(now = new Date()) {
    const dayName = DAYS[now.getDay()];
    const nowMinutes = now.getHours() * 60 + now.getMinutes();
    const today = now.toISOString().slice(0, 10);
    const todayExams = examForDate(exams, today);

    // EXAM PRIORITY: on any exam day, show the exam instead of a class.
    if (todayExams.length) {
      const currentExam = todayExams.find((e) => {
        const start = timeToMinutes(e.time);
        return start !== null && start <= nowMinutes && nowMinutes < start + 180;
      });

      if (currentExam) {
        return { type: "exam", entry: currentExam, remaining: 0, until: 0, todayExams };
      }

      const nextExam = todayExams.find((e) => {
        const start = timeToMinutes(e.time);
        return start !== null && start > nowMinutes;
      });

      if (nextExam) {
        return {
          type: "exam-next",
          entry: nextExam,
          until: Math.max(0, timeToMinutes(nextExam.time) - nowMinutes),
          todayExams
        };
      }

      return { type: "exam-done", entry: todayExams[todayExams.length - 1], remaining: 0, until: 0, todayExams };
    }

    const todayEntries = timetable
      .filter((e) => e.day === dayName && e.start && e.end)
      .sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));

    const current = todayEntries.find((e) => {
      const start = timeToMinutes(e.start);
      const end = timeToMinutes(e.end);
      return start <= nowMinutes && nowMinutes < end;
    });

    if (current) {
      const endMinutes = timeToMinutes(current.end);
      const remaining = Math.max(0, endMinutes - nowMinutes);
      return { type: "current", entry: current, remaining };
    }

    const next = todayEntries.find((e) => timeToMinutes(e.start) > nowMinutes);
    if (next) {
      const until = Math.max(0, timeToMinutes(next.start) - nowMinutes);
      return { type: "next", entry: next, until };
    }

    return { type: "done", entry: null, remaining: 0 };
  }

  function nextClassSummary() {
    const priority = getPrioritySchedule(timetable, exams, new Date());

    if (priority?.type === "exam" || priority?.type === "exam-next") {
      const e = priority.entry;
      return `Exam priority: ${e.subject} starts at ${formatTime12(e.time)}${e.room ? ` in ${e.room}` : ""}. Classes are not promoted over exams on an exam day.`;
    }

    if (priority?.type === "exam-day") {
      return `Today is an exam day. Your exam priority is ${priority.entry.subject} at ${formatTime12(priority.entry.time)}.`;
    }

    const next = priority?.type === "class" ? priority : getNextClass(timetable, new Date());
    if (!next) return "You don't have any classes on your timetable yet. Add some in the Timetable tab.";

    const { entry, daysAway } = next;
    if (daysAway === 0) {
      const mins = timeToMinutes(entry.start) - (new Date().getHours() * 60 + new Date().getMinutes());
      return `Your next class is ${entry.subject} in Room ${entry.room || "TBA"} with ${entry.teacher || "your teacher"}, starting at ${formatTime12(entry.start)} (in ${mins} min).`;
    }
    return `Your next class is ${entry.subject} on ${entry.day} at ${formatTime12(entry.start)} in Room ${entry.room || "TBA"} with ${entry.teacher || "your teacher"}.`;
  }

  function getBotResponse(raw) {
    const text = raw.toLowerCase();
    if (text.includes("current class") || text.includes("current lecture") || text.includes("which class") || text.includes("class right now") || text.includes("what class")) {
      const live = getLiveClassInfo(new Date());
      if (live.type === "current") {
        if (String(live.entry.subject).trim().toUpperCase() === "FREE") return `You have a free period right now. It ends at ${formatTime12(live.entry.end)}.`;
        return `Your current class is ${live.entry.subject}. It runs from ${formatTime12(live.entry.start)} to ${formatTime12(live.entry.end)}, in Room ${live.entry.room || "TBA"}${live.entry.teacher ? ` with ${live.entry.teacher}` : ""}.`;
      }
      if (live.type === "next") return `You are free right now. Your next class is ${live.entry.subject} at ${formatTime12(live.entry.start)}, in ${live.until} min.`;
      return "You have no more classes scheduled today.";
    }
    if (text.includes("time left") || text.includes("how much time") || text.includes("remaining time") || text.includes("when does.*end")) {
      const live = getLiveClassInfo(new Date());
      if (live.type === "current") return `You have ${live.remaining} min left in ${live.entry.subject}. It ends at ${formatTime12(live.entry.end)}.`;
      if (live.type === "next") return `You are currently free. ${live.entry.subject} starts in ${live.until} min.`;
      return "There is no class left today.";
    }
    if (text.includes("next class") || text.includes("next lecture") || text.includes("upcoming class") || text.includes("what next")) {
      return nextClassSummary();
    }
    if (text.includes("homework")) {
      const today = todayStr();
      const pending = [...homework].filter((h) => !h.dueDate || h.dueDate >= today).sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
      if (pending.length === 0) return "You're all caught up — no pending homework logged.";
      return "Here's what's pending:\n" + pending.slice(0, 6).map((h) => `• ${h.subject}: ${h.description} (due ${formatDateReadable(h.dueDate)})`).join("\n");
    }
    if (text.includes("exam") || text.includes("datesheet") || text.includes("test")) {
      const today = todayStr();
      const upcoming = [...exams].filter((e) => !e.date || e.date >= today).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
      if (upcoming.length === 0) return "No exams on your datesheet yet. Add them in the Exams tab.";
      return "Upcoming exams:\n" + upcoming.slice(0, 6).map((e) => `• ${e.subject} — ${formatDateReadable(e.date)} at ${formatTime12(e.time)}, Room ${e.room || "TBA"}`).join("\n");
    }
    const mentionedDay = DAYS.find((d) => text.includes(d.toLowerCase()));
    const targetDay = mentionedDay || (text.includes("today") ? todayName() : null);
    if (targetDay) {
      const dayClasses = timetable.filter((e) => e.day === targetDay && e.start).sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));
      if (dayClasses.length === 0) {
        return `No information available for this day.\n\n${nextClassSummary()}`;
      }
      const label = targetDay === todayName() ? `${targetDay} (today)` : targetDay;
      return `Here's what's on ${label}:\n` + dayClasses.map((e) => `• ${formatTime12(e.start)} — ${e.subject} in Room ${e.room || "TBA"} (${e.teacher || "—"})`).join("\n");
    }
    return "I can tell you about your next class, a specific day's schedule, pending homework, or upcoming exams. Just ask!";
  }

  function handleSend(text) {
    const trimmed = (text ?? input).trim();
    if (!trimmed) return;
    setMessages((prev) => [...prev, { id: genId(), sender: "user", text: trimmed, time: new Date() }]);
    setInput("");
    setTimeout(() => {

const GEMINI_TIMETABLE_MODEL = "gemini-3.5-flash-lite";
const GEMINI_TIMETABLE_FALLBACK = "gemini-3.6-flash";
const GEMINI_TIMETABLE_TIMEOUT = 75000;
const GEMINI_EXAM_MODEL = "gemini-3.7-flash";
const GEMINI_EXAM_FALLBACK = "gemini-3.6-flash";
const GEMINI_EXAM_TIMEOUT = 60000;

const GEMINI_DISCOVERY_SCHEMA = {
  type: "object",
  properties: {
    classes: {
      type: "array",
      items: {
        type: "object",
        properties: {
          class_name: { type: "string" },
          section: { type: "string" },
          page: { type: "integer" },
          description: { type: "string" }
        },
        required: ["class_name", "section", "page", "description"]
      }
    }
  },
  required: ["classes"]
};

const GEMINI_TIMETABLE_SCHEMA = {
  type: "object",
  properties: {
    class_name: { type: "string" },
    section: { type: "string" },
    entries: {
      type: "array",
      items: {
        type: "object",
        properties: {
          day: { type: "string" },
          start: { type: "string" },
          end: { type: "string" },
          subject: { type: "string" },
          room: { type: "string" },
          teacher: { type: "string" },
          group: { type: "string" }
        },
        required: ["day", "start", "end", "subject", "room", "teacher", "group"]
      }
    }
  },
  required: ["class_name", "section", "entries"]
};

function geminiTimetableFilePart(file) {
  return new Promise((resolve, reject) => {
    if (!["application/pdf", "image/jpeg", "image/png", "image/webp"].includes(file.type)) {
      reject(new Error("Please upload a PDF, JPG, PNG, or WEBP timetable."));
      return;
    }
    if (file.size > 18 * 1024 * 1024) {
      reject(new Error("For this browser test, keep the timetable file under 18 MB."));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const dataUrl = String(reader.result || "");
        const comma = dataUrl.indexOf(",");
        if (comma < 0) throw new Error("Could not prepare the timetable file.");
        resolve({
          inline_data: {
            mime_type: file.type,
            data: dataUrl.slice(comma + 1)
          }
        });
      } catch (e) {
        reject(e);
      }
    };
    reader.onerror = () => reject(new Error("Could not read the selected timetable file."));
    reader.readAsDataURL(file);
  });
}

async function geminiTimetableRequest(
    parts,
    schema,
    model = GEMINI_TIMETABLE_MODEL,
    generationConfigOverride = null
) {
    const controller = new AbortController();

    const timer = setTimeout(
        () => controller.abort(),
        String(model || "").includes("3.7") || String(model || "").includes("3.6") ? GEMINI_EXAM_TIMEOUT : GEMINI_TIMETABLE_TIMEOUT
    );

    try {
        const response = await fetch(
            "https://lucy-gemini-api.amritranabpt.workers.dev/",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    model: model,

                    contents: [
                        {
                            role: "user",
                            parts: parts
                        }
                    ],

                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: schema,
                        maxOutputTokens: 24000,
                        thinkingConfig: {
                            thinkingLevel: "minimal"
                        },
                        ...(generationConfigOverride || {})
                    }
                }),

                signal: controller.signal
            }
        );

        const raw = await response.text();

        let data;

        try {
            data = JSON.parse(raw);
        } catch {
            throw new Error(
                "Gemini proxy returned an invalid response."
            );
        }

        if (!response.ok) {
            throw new Error(
                data?.error?.message ||
                data?.message ||
                `Gemini request failed (${response.status}).`
            );
        }

        const output =
            data?.candidates?.[0]?.content?.parts
                ?.map((p) => p.text || "")
                .join("") || "";

        if (!output) {
            throw new Error(
                "Gemini returned no timetable data."
            );
        }

        try {
            return JSON.parse(output);
        } catch {
            throw new Error(
                "Gemini returned invalid JSON. Please try the timetable again."
            );
        }

    } catch (e) {

        if (e?.name === "AbortError") {
            throw new Error(
                "Gemini did not finish the single full-datesheet scan within 60 seconds. Try the original PDF or a smaller semester/branch-specific file."
            );
        }

        throw e;

    } finally {
        clearTimeout(timer);
    }
}

function geminiTimetableDiscoveryPrompt() {
  return `
You are a fast timetable classifier.
Inspect the uploaded PDF/photo and identify ONLY distinct class/section timetable choices visibly printed.
Valid choices look like 3-Sec-A, 3-Sec-B, 2-Sec-A, etc.
Do not return subjects, teachers, rooms, days, or random OCR text as choices.
If a page has a course heading and section, put the course heading in class_name and the section in section.
Return the 1-based page number.
Do not invent choices. If only one timetable exists, return one choice.
Return JSON only.
`;
}

function geminiTimetableExtractionPrompt(choice, selectedGroup) {
  const groupRule = selectedGroup && selectedGroup !== "ALL"
    ? `The student is in GROUP ${selectedGroup}. When a timetable has Group 1/Group 2 (or G1/G2/A/B) columns, preserve the group exactly and exclude the other group after the user selects their group. If the timetable contains multiple groups (for example G1/G2, A/B, Group 1/Group 2), include ONLY the sessions belonging to GROUP ${selectedGroup}. Do not include the other group's sessions. If a common class is shared by all groups, include it. Keep the actual group label in the group field.`
    : "If the timetable contains group-specific sessions, preserve the actual group label in the group field and include common sessions.";
  return `
Extract the complete timetable for ONLY this selected timetable:
Class: ${choice.class_name}
Section: ${choice.section}
Page: ${choice.page}
Selected student group: ${selectedGroup || "ALL"}

Rules:
- Read the actual uploaded PDF/photo. Never use a saved or hardcoded timetable.
- Return every visible timetable cell for Monday-Friday that belongs to the selected class/section and selected group.
- Use the actual printed start/end times.
- A physically merged cell spanning multiple time slots is ONE entry covering the full span.
- "-x-", "x", or explicitly empty/free cells become subject "FREE" with blank teacher and room.
- FREE must never be merged into a neighboring class.
- Never combine neighboring cells.
- Keep subject, teacher, room, and group separate.
- Labs, tutorials, internship, mini-project and G1/G2 activities are real entries.
- ${groupRule}
- Do not guess missing information; use empty strings.
Return JSON only.
`;
}

function geminiNormalizeDay(value) {
  const s = String(value || "").trim().toLowerCase();
  return DAYS.find((d) => d.toLowerCase() === s) ||
    DAYS.find((d) => d.toLowerCase().startsWith(s.slice(0, 3))) || "";
}

function geminiNormalizeTime(value) {
  const s = String(value || "").trim().replace(/[–—−]/g, "-");
  const m = s.match(/(\d{1,2})\s*[:.]\s*(\d{2})(?:\s*(AM|PM))?/i);
  if (!m) return "";
  let h = Number(m[1]);
  const min = Number(m[2]);
  const ap = (m[3] || "").toUpperCase();
  if (ap === "PM" && h < 12) h += 12;
  if (ap === "AM" && h === 12) h = 0;
  if (h > 23 || min > 59) return "";
  return `${String(h).padStart(2, "0")}:${String(min).padStart(2, "0")}`;
}

async function discoverGeminiTimetable(filePart) {
  try {
    return await geminiTimetableRequest(
      [filePart, { text: geminiTimetableDiscoveryPrompt() }],
      GEMINI_DISCOVERY_SCHEMA
    );
  } catch (e) {
    if (/404|not found|model/i.test(e.message || "")) {
      return await geminiTimetableRequest(
        [filePart, { text: geminiTimetableDiscoveryPrompt() }],
        GEMINI_DISCOVERY_SCHEMA,
        GEMINI_TIMETABLE_FALLBACK
      );
    }
    throw e;
  }
}

async function extractGeminiTimetable(filePart, choice, selectedGroup) {
  try {
    return await geminiTimetableRequest(
      [filePart, { text: geminiTimetableExtractionPrompt(choice, selectedGroup) }],
      GEMINI_TIMETABLE_SCHEMA
    );
  } catch (e) {
    if (/404|not found|model/i.test(e.message || "")) {
      return await geminiTimetableRequest(
        [filePart, { text: geminiTimetableExtractionPrompt(choice, selectedGroup) }],
        GEMINI_TIMETABLE_SCHEMA,
        GEMINI_TIMETABLE_FALLBACK
      );
    }
    throw e;
  }
}

  const [form, setForm] = useState({ day: "Monday", start: "", end: "", subject: "", room: "", teacher: "" });
  const [formError, setFormError] = useState(null);
  const [preview, setPreview] = useState(null);
  const [scanning, setScanning] = useState(false);
  const [scanError, setScanError] = useState(null);
  const [importStage, setImportStage] = useState("file");
  const [selectedFile, setSelectedFile] = useState(null);
  const [filePart, setFilePart] = useState(null);
  const [choices, setChoices] = useState([]);
  const [selectedChoice, setSelectedChoice] = useState("");
  const [selectedGroup, setSelectedGroup] = useState("ALL");
  const [importInfo, setImportInfo] = useState("");

  function addEntry(e) {
    e.preventDefault();
    if (!form.subject.trim()) {
      setFormError("Add a subject name before saving this class.");
      return;
    }
    setFormError(null);
    setTimetable((prev) => [...prev, { ...form, subject: form.subject.trim(), id: genId() }]);
    setForm({ day: form.day, start: "", end: "", subject: "", room: "", teacher: "" });
  }

  function removeEntry(id) {
    setTimetable((prev) => prev.filter((e) => e.id !== id));
  }

  async function handleGeminiFile(e) {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;

    setSelectedFile(file);
    setPreview(null);
    setScanError(null);
    setImportInfo("");
    setImportStage("file");
    setChoices([]);

    setScanning(true);
    try {
      setImportInfo("Preparing the file…");
      const part = await geminiTimetableFilePart(file);
      setFilePart(part);

      setImportInfo("Gemini is identifying the class/section names…");
      const result = await discoverGeminiTimetable(part);
      const found = (result?.classes || [])
        .filter((c) => c && c.class_name)
        .map((c) => ({
          class_name: String(c.class_name).trim(),
          section: String(c.section || "").trim(),
          page: Number(c.page) || 1,
          description: String(c.description || "").trim()
        }));

      if (!found.length) {
        throw new Error("Gemini could not find a class/section timetable in this file.");
      }

      setChoices(found);
      setSelectedChoice("0");
      setImportStage("choose");
      setImportInfo(`${found.length} timetable choice${found.length === 1 ? "" : "s"} found.`);
    } catch (err) {
      setScanError(err?.message || "Could not read the timetable.");
    } finally {
      setScanning(false);
    }
  }

  async function readSelectedGeminiTimetable() {
    const choice = choices[Number(selectedChoice)];
    if (!choice || !filePart) return;

    setScanning(true);
    setScanError(null);
    setImportInfo(`Gemini is reading ${choice.class_name}${choice.section ? ` — ${choice.section}` : ""}${selectedGroup !== "ALL" ? ` for Group ${selectedGroup}` : ""}…`);

    try {
      const result = await extractGeminiTimetable(filePart, choice, selectedGroup);
      const rows = (result?.entries || [])
        .map((r) => ({
          id: genId(),
          include: true,
          day: geminiNormalizeDay(r.day),
          start: geminiNormalizeTime(r.start),
          end: geminiNormalizeTime(r.end),
          subject: String(r.subject || "").trim() || "FREE",
          room: String(r.room || "").trim(),
          teacher: String(r.teacher || "").trim(),
          group: String(r.group || "").trim()
        }))
        .filter((r) => r.day && r.start && r.end);

      if (!rows.length) {
        throw new Error("Gemini found the selected timetable but returned no usable classes.");
      }

      setPreview(rows);
      setImportStage("preview");
      setImportInfo(`${rows.length} timetable entries found. Check them before adding.`);
    } catch (err) {
      setScanError(err?.message || "Could not extract the selected timetable.");
    } finally {
      setScanning(false);
    }
  }

  function updatePreviewRow(i, patch) {
    setPreview((prev) => prev.map((r, idx) => (idx === i ? { ...r, ...patch } : r)));
  }

  function removePreviewRow(i) {
    setPreview((prev) => prev.filter((_, idx) => idx !== i));
  }

  function confirmPreview(mode = "add") {
    const toAdd = (preview || [])
      .filter((r) => r.include && r.day && r.subject)
      .map(({ id, include, ...rest }) => ({ ...rest, id: genId() }));

    if (!toAdd.length) {
      setScanError("There are no selected timetable rows to add.");
      return;
    }

    setTimetable((prev) => mode === "replace" ? toAdd : [...prev, ...toAdd]);
    setPreview(null);
    setImportStage("file");
    setSelectedFile(null);
    setFilePart(null);
    setChoices([]);
    setImportInfo(`Added ${toAdd.length} timetable entries.`);
    setScanError(null);
  }

  const sorted = [...timetable].sort((a, b) => {
    const di = DAYS.indexOf(a.day) - DAYS.indexOf(b.day);
    if (di !== 0) return di;
    return (timeToMinutes(a.start) ?? 9999) - (timeToMinutes(b.start) ?? 9999);
  });

  return (

      <SectionHeader icon={Calendar} title="Timetable" subtitle="Add classes manually, import CSV, or read a PDF/photo with Gemini" />

      <Card>
        <div className="flex items-center justify-between gap-3 flex-wrap mb-4">

            <h3 className="font-display font-bold text-slate-900">🤖 Gemini timetable importer</h3>
            <p className="text-xs text-slate-500 mt-1">Upload the original PDF when possible. Gemini reads the document structure and lets you choose the class/section.</p>

          <label className={`px-4 py-2 rounded-lg font-semibold text-sm cursor-pointer ${scanning ? "bg-slate-200 text-slate-500" : "bg-amber-400 text-slate-900 hover:bg-amber-300"}`}>
            {scanning ? "Reading…" : "📅 Upload timetable"}
            <input
              type="file"
              accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp"

        {selectedFile && (

        )}

        {scanError && (
          <div className="mt-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm p-3">{scanError}</div>
        )}

        {importStage === "choose" && choices.length > 0 && (
          <div className="mt-5 border-t border-slate-200 pt-5">
            <label className="text-xs text-slate-500">Which class/section timetable do you want?</label>
            <select

              <p className="text-[11px] text-slate-400 mt-1">Lucy will keep common classes and filter out the other group's sessions.</p>

            <div className="flex gap-2 mt-3">
              <button onClick={readSelectedGeminiTimetable} disabled={scanning} className="px-4 py-2 rounded-lg bg-slate-900 text-white text-sm font-semibold disabled:opacity-50">

              <div>

            </div>
          );
        })}
      </div>
    </div>
  );
}


// One-pass datesheet schema.
// The PDF is scanned ONCE: Gemini returns both the academic filters and all
// exam rows. Lucy then filters the returned rows locally after the user chooses
// semester/course/branch. This avoids two expensive full-PDF Gemini calls.
const GEMINI_DATESHEET_SCHEMA = {
  type: "object",
  properties: {
    semesters: { type: "array", items: { type: "string" } },
    courses: { type: "array", items: { type: "string" } },
    branches: { type: "array", items: { type: "string" } },
    exams: {
      type: "array",
      items: {
        type: "object",
        properties: {
          subject: { type: "string" },
          date: { type: "string" },
          time: { type: "string" },
          room: { type: "string" },
          notes: { type: "string" },
          semester: { type: "string" },
          course: { type: "string" },
          branch: { type: "string" }
        },
        required: ["subject", "date", "time", "room", "notes", "semester", "course", "branch"]
      }
    }
  },
  required: ["semesters", "courses", "branches", "exams"]
};

function geminiDatesheetOnePassPrompt() {
  const currentYear = new Date().getFullYear();
  return `
You are an expert college examination-datesheet extraction engine.
The uploaded PDF/image is the ONLY source of truth.

GOAL:
Scan the ENTIRE document ONCE and return:
1) every distinct academic Semester label,
2) every distinct Course label,
3) every distinct Branch label,
4) every exam row that can be reliably read.

This output will later be filtered locally by the student. Therefore DO NOT choose
a student profile yourself and DO NOT omit exam rows just because they belong to
another semester/course/branch. Extract the complete college-wide exam dataset.

ACCURACY IS MORE IMPORTANT THAN SPEED, but you must complete the scan within one
API request. Use strong visual/table reasoning.

DOCUMENT READING:
- Read every page, not only the first page.
- Understand the full table before transcribing rows.
- Build an internal page/table map: page -> table title -> semester -> course -> branch -> headers.
- Track merged headings and inherited labels until a new heading replaces them.
- Track date/time columns independently from subject/paper-code columns.
- For matrix tables, read the exact row/column intersection.
- Treat continuation pages as continuation of the preceding table when the structure shows that.
- Do not shift a date/time/room/subject from an adjacent row.
- Preserve paper codes and printed subject names in notes/subject when visible.
- Include common/universal papers when the document explicitly assigns them.
- Return every distinct exam row, including rows at the bottom of pages.
- Do not invent unreadable values. Use "" for an unreadable field.
- If a row is genuinely not an exam row, do not include it.

ACADEMIC LABELS:
- Preserve the exact printed wording where possible.
- A semester may be I Sem, II Sem, 1st Sem, Semester-I, etc.
- A course may be B.Tech, BCA, MBA, etc.
- A branch may be CSE, AI&ML, Artificial Intelligence and Machine Learning, etc.
- Do not treat an academic session such as 2025-26 as a semester.
- Do not invent labels.
- Return labels from ALL pages, not just the first page.

DATE/TIME:
- Read the date from the SAME exam row/block as the subject.
- Normalize a confidently read date to YYYY-MM-DD.
- If the year is not printed, infer it only from the datesheet's own session/context.
- Read time from the SAME row/block and normalize to HH:MM.
- Do not invent rooms.

VERIFICATION:
Before final JSON, perform a second mental cross-check of every returned row:
page/table context + semester + course + branch + paper code + subject + date + time.
A missing field is preferable to a wrong field.

OUTPUT ONLY THIS JSON:
{
  "semesters": ["..."],
  "courses": ["..."],
  "branches": ["..."],
  "exams": [
    {
      "subject": "...",
      "date": "YYYY-MM-DD",
      "time": "HH:MM",
      "room": "",
      "notes": "paper code / printed details",
      "semester": "...",
      "course": "...",
      "branch": "..."
    }
  ]
}

Return every real exam row found in the uploaded document.
`;
}

async function extractGeminiDatesheetOnePass(file) {
  const filePart = await geminiTimetableFilePart(file);
  const cfg = {
    responseMimeType: "application/json",
    responseSchema: GEMINI_DATESHEET_SCHEMA,
    maxOutputTokens: 24000,
    thinkingConfig: { thinkingLevel: "high" }
  };

  return await geminiTimetableRequest(
    [filePart, { text: geminiDatesheetOnePassPrompt() }],
    GEMINI_DATESHEET_SCHEMA,
    GEMINI_EXAM_MODEL,
    cfg
  );
}

const GEMINI_EXAM_FILTER_SCHEMA = {
  type: "object",
  properties: {
    semesters: { type: "array", items: { type: "string" } },
    courses: { type: "array", items: { type: "string" } },
    branches: { type: "array", items: { type: "string" } }
  },
  required: ["semesters", "courses", "branches"]
};

function geminiExamFilterPrompt() {
  return `
You are a fast academic-structure detector for a college-wide examination datesheet.
Inspect the ENTIRE PDF/image and identify the exact academic labels printed in the document.
Do not transcribe exam rows in this first pass.
Return ONLY JSON: {"semesters":[],"courses":[],"branches":[]}

IMPORTANT:
- Read table headings, merged cells, row labels, footers and continuation pages.
- A semester may be written as I Sem, II Sem, 1st Sem, Semester-I, etc. Preserve the printed wording.
- A course may be B.Tech, BCA, MBA, etc. Preserve the printed wording.
- A branch may be CSE, AI&ML, Artificial Intelligence and Machine Learning, etc. Preserve the printed wording.
- Do not treat an academic session such as 2025-26 as a semester.
- Do not invent labels that are not printed.
- If the document has no separate value for a category, return an empty array for that category.
- Return every distinct label found across ALL pages, not only the first page.
`;
}

async function legacyDiscoverGeminiExamFilters(file) {
  const filePart = await geminiTimetableFilePart(file);
  const cfg = {
    responseMimeType: "application/json",
    responseSchema: GEMINI_EXAM_FILTER_SCHEMA,
    maxOutputTokens: 12000,
    thinkingConfig: { thinkingLevel: "medium" }
  };
  try {
    return await geminiTimetableRequest([filePart, { text: geminiExamFilterPrompt() }], GEMINI_EXAM_FILTER_SCHEMA, GEMINI_EXAM_MODEL, cfg);
  } catch (e) {
    if (/404|not found|model/i.test(e.message || "")) {
      return await geminiTimetableRequest([filePart, { text: geminiExamFilterPrompt() }], GEMINI_EXAM_FILTER_SCHEMA, GEMINI_EXAM_FALLBACK, {
        ...cfg,
        thinkingConfig: { thinkingLevel: "high" }
      });
    }
    throw e;
  }
}

function geminiExamPrompt(filters = {}) {
  const currentYear = new Date().getFullYear();
  return `
You are an expert examination-datesheet transcriber. The uploaded PDF/image is the ONLY source of truth.
This is a HIGH ACCURACY task. Use deliberate visual/table reasoning. Do not guess, autocomplete, or use outside knowledge.

STUDENT PROFILE:
Semester: ${filters.semester || "ALL"}
Course: ${filters.course || "ALL"}
Branch: ${filters.branch || "ALL"}

YOUR JOB:
Read the COMPLETE document, not a cropped region and not just the first page. First understand the table structure, then transcribe EVERY exam row that belongs to the selected profile.

CRITICAL TABLE RULES:
1. Read every page from beginning to end before producing JSON.
2. Build a page/table map first: page -> table title -> semester -> course -> branch -> column headers.
3. Track merged cells and section headings vertically and horizontally. A heading can govern many rows until another heading replaces it.
4. Track column headers independently from row labels. Never shift a date, time, subject, or branch from an adjacent row.
4. When a page continues a table from the previous page, carry forward the previous table's academic context and column headers.
5. Include common/universal papers ONLY when the document explicitly shows that they apply to the selected profile.
6. Exclude every row belonging to another semester, course, or branch.
7. Preserve the printed subject/paper title and paper code exactly as closely as possible.
8. If a value is genuinely unreadable, return an empty string. Never invent it.
9. Return ALL matching exams, including the last row on every page.
10. Before finalizing, silently cross-check EACH returned exam against the source page/table: correct academic block + correct subject/paper code + correct date + correct time.
11. Do not stop after finding a few matches. Continue scanning every page until the complete selected profile has been covered.
12. When the datesheet is a matrix, first map the column headers and row labels, then read the intersection cell; never read a nearby date/time merely because it is visually close.
13. When semester/course/branch appears once as a merged heading, carry that context forward only until the next explicit heading changes it.
14. Treat continuation pages as part of the same table when their headings/columns indicate continuation.
15. Preserve paper codes because they are an important cross-check for the correct exam.
16. If two rows look similar, keep both when both are visibly present; never collapse rows merely because the subject names are similar.
17. If the selected profile cannot be established confidently for a row, OMIT that row rather than guessing.
18. Before writing the final JSON, perform a second pass over every matching row and verify: page, inherited heading, paper code, subject, date, time.
19. Prefer a missing field over a wrong field. A wrong exam is worse than an omitted exam.
20. Never copy an exam from a neighboring semester/branch just because the subject name is similar.

ACADEMIC FILTERING:
- The selected semester/course/branch are filters, not hints.
- Match common abbreviations and equivalent printed forms (for example CSE vs Computer Science and Engineering) only when the document itself establishes that equivalence.
- If the selected branch is absent from a row because the row inherits a branch heading above it, carry that heading down.
- If the selected profile has common papers plus branch-specific papers, include both only when the document assigns them to that profile.

DATE/TIME:
- Copy the printed date exactly first, then normalize it to YYYY-MM-DD.
- If no year is printed, use ${currentYear} only after checking the datesheet's own academic/session context.
- Copy the time from the SAME row/block. Normalize to 24-hour HH:MM.
- Do not invent a room if none is printed.

OUTPUT ONLY this JSON:
{"exams":[{"subject":"...","date":"YYYY-MM-DD","time":"HH:MM","room":"","notes":"paper code / printed details","semester":"...","course":"...","branch":"..."}]}

Every returned object MUST be a real exam row from the uploaded document. If there are no matching rows, return {"exams":[]}.
`;
}

async function legacyExtractGeminiExams(file, filters = {}) {
  const filePart = await geminiTimetableFilePart(file);
  const cfg = {
    responseMimeType: "application/json",
    responseSchema: GEMINI_EXAM_SCHEMA,
    maxOutputTokens: 32000,
    thinkingConfig: { thinkingLevel: "high" }
  };
  try {
    return await geminiTimetableRequest([filePart, { text: geminiExamPrompt(filters) }], GEMINI_EXAM_SCHEMA, GEMINI_EXAM_MODEL, cfg);
  } catch (e) {
    if (/404|not found|model/i.test(e.message || "")) {
      return await geminiTimetableRequest([filePart, { text: geminiExamPrompt(filters) }], GEMINI_EXAM_SCHEMA, GEMINI_EXAM_FALLBACK, cfg);
    }
    throw e;
  }
}

function ExamsTab({ exams, setExams }) {
  const [form, setForm] = useState({ subject: "", date: "", time: "", room: "", notes: "" });
  const [preview, setPreview] = useState(null);
  const [scanning, setScanning] = useState(false);
  const [scanError, setScanError] = useState(null);
  const [filterChoices, setFilterChoices] = useState(null);
  const [filters, setFilters] = useState({ semester: "", course: "", branch: "" });
  const imageInputRef = useRef(null);

  function addEntry(e) {
    e.preventDefault();
    if (!form.subject || !form.date) return;
    setExams((prev) => [...prev, { ...form, id: genId() }]);
    setForm({ subject: "", date: "", time: "", room: "", notes: "" });
  }

  function removeEntry(id) {
    setExams((prev) => prev.filter((e) => e.id !== id));
  }

  async function handleImageFile(e) {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;

    setScanning(true);
    setScanError(null);
    setPreview(null);
    setFilterChoices(null);

    try {
      // IMPORTANT: one Gemini call only.
      // The previous version used one full-PDF call to discover filters and a
      // second full-PDF call to extract exams. That doubled latency and made the
      // 60-second browser timeout much easier to hit.
      const data = await extractGeminiDatesheetOnePass(file);

      const semesters = Array.isArray(data?.semesters)
        ? data.semesters.map(String).map((x) => x.trim()).filter(Boolean)
        : [];
      const courses = Array.isArray(data?.courses)
        ? data.courses.map(String).map((x) => x.trim()).filter(Boolean)
        : [];
      const branches = Array.isArray(data?.branches)
        ? data.branches.map(String).map((x) => x.trim()).filter(Boolean)
        : [];

      const allExams = Array.isArray(data?.exams) ? data.exams : [];

      if (!semesters.length && !courses.length && !branches.length && !allExams.length) {
        throw new Error("Gemini finished the scan but could not find readable academic sections or exam rows.");
      }

      setFilterChoices({
        file,
        semesters,
        courses,
        branches,
        allExams
      });

      setFilters({
        semester: semesters.length === 1 ? semesters[0] : "",
        course: courses.length === 1 ? courses[0] : "",
        branch: branches.length === 1 ? branches[0] : ""
      });
    } catch (err) {
      setScanError(err?.message || "Could not read this datesheet. Please try the original PDF.");
    } finally {
      setScanning(false);
    }
  }

  async function readFilteredDatesheet() {
    if (!filterChoices) return;

    if (
      (filterChoices.semesters.length > 0 && !filters.semester) ||
      (filterChoices.courses.length > 0 && !filters.course) ||
      (filterChoices.branches.length > 0 && !filters.branch)
    ) {
      setScanError("Please select your semester, course and branch before reading the datesheet.");
      return;
    }

    setScanning(true);
    setScanError(null);

    try {
      const normalizeLabel = (v) =>
        String(v || "")
          .toLowerCase()
          .replace(/[–—-]/g, " ")
          .replace(/[^a-z0-9]+/g, " ")
          .trim();

      const selectedSemester = normalizeLabel(filters.semester);
      const selectedCourse = normalizeLabel(filters.course);
      const selectedBranch = normalizeLabel(filters.branch);

      const matches = (actual, selected) => {
        if (!selected) return true;
        const a = normalizeLabel(actual);
        if (!a) return false;
        return a === selected || a.includes(selected) || selected.includes(a);
      };

      // No Gemini call here. The complete document was already extracted in
      // handleImageFile(), so this operation is instant.
      const cleaned = (filterChoices.allExams || [])
        .filter((r) =>
          matches(r.semester, selectedSemester) &&
          matches(r.course, selectedCourse) &&
          matches(r.branch, selectedBranch)
        )
        .map((r) => ({
          id: genId(),
          include: true,
          subject: String(r.subject || "").trim(),
          date: /^\d{4}-\d{2}-\d{2}$/.test(String(r.date || "")) ? String(r.date) : "",
          time: geminiNormalizeTime(r.time),
          room: String(r.room || "").trim(),
          notes: String(r.notes || "").trim(),
          semester: String(r.semester || filters.semester || "").trim(),
          course: String(r.course || filters.course || "").trim(),
          branch: String(r.branch || filters.branch || "").trim()
        }))
        .filter((r) => r.subject && r.date);

      if (!cleaned.length) {
        setScanError(
          "No matching exams were found for that semester/course/branch. Check the profile selection or verify the datesheet headings."
        );
      } else {
        setPreview(cleaned);
        setFilterChoices(null);
      }
    } catch (err) {
      setScanError(err?.message || "Something went wrong filtering the extracted datesheet.");
    } finally {
      setScanning(false);
    }
  }

  function updatePreviewRow(i, patch) {
    setPreview((prev) => prev.map((r, idx) => (idx === i ? { ...r, ...patch } : r)));
  }

  function confirmPreview() {
    const toAdd = (preview || []).filter((r) => r.include && r.date && r.subject).map(({ id, include, ...rest }) => ({ ...rest, id: genId() }));
    if (!toAdd.length) { setScanError("There are no valid selected exams to add."); return; }
    setExams((prev) => [...prev, ...toAdd]);
    setPreview(null); setScanError(null);
  }

  const sorted = [...exams].sort((a, b) => (a.date || "").localeCompare(b.date || ""));

  return (
    <div className="max-w-2xl mx-auto space-y-6">
      <SectionHeader icon={GraduationCap} title="Exam datesheet" subtitle="Upload the college-wide datesheet and Lucy will ask your semester, course and branch before importing your exams." />

      <Card>
        <div className="flex items-center justify-between gap-3 flex-wrap mb-4">
          <div>
            <h3 className="font-display font-bold text-slate-900">🤖 Gemini datesheet importer</h3>
            <p className="text-xs text-slate-500 mt-1">Gemini scans the complete datesheet once. Lucy then lets you choose your semester, course and branch.</p>
          </div>
          <button onClick={() => imageInputRef.current?.click()} disabled={scanning} className="flex items-center gap-2 bg-amber-400 text-slate-900 font-semibold rounded-lg px-4 py-2 text-sm hover:bg-amber-300 disabled:opacity-60">
            {scanning ? <Loader2 size={15} /> : <Upload size={15} />}
            {scanning ? "Gemini is scanning…" : "📄 Upload datesheet"}
          </button>
          <input ref={imageInputRef} type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp" onChange={handleImageFile} className="hidden" />
        </div>

        {filterChoices && (
          <div className="border-t border-slate-200 pt-4 space-y-3">
            <p className="text-sm font-semibold text-slate-900">Choose your student profile</p>
            {[["semester", "Semester", filterChoices.semesters], ["course", "Course", filterChoices.courses], ["branch", "Branch", filterChoices.branches]].map(([key, label, options]) => (
              <div key={key}>
                <label className="text-xs text-slate-500">{label}</label>
                <select value={filters[key]} onChange={(e) => setFilters((f) => ({ ...f, [key]: e.target.value }))} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm mt-1">
                  <option value="">{options.length ? `Select ${label.toLowerCase()}` : `No ${label.toLowerCase()} split detected`}</option>
                  {options.map((v) => <option key={v} value={v}>{v}</option>)}
                </select>
              </div>
            ))}
            <div className="flex gap-2">
              <button onClick={readFilteredDatesheet} disabled={scanning} className="px-4 py-2 rounded-lg bg-slate-900 text-white text-sm font-semibold disabled:opacity-50">{scanning ? "Scanning…" : "Read my exams"}</button>
              <button onClick={() => setFilterChoices(null)} className="px-4 py-2 rounded-lg border border-slate-300 text-sm">Cancel</button>
            </div>
          </div>
        )}

        {scanError && <div className="mt-3 flex items-start justify-between gap-2 bg-rose-50 border border-rose-200 text-rose-600 text-sm rounded-lg px-4 py-3"><span>{scanError}</span><button onClick={() => setScanError(null)}><X size={14} /></button></div>}
      </Card>

      <Card>
        <form onSubmit={addEntry} className="grid grid-cols-2 gap-2">
          <div><label className="text-xs text-slate-500">Subject</label><input value={form.subject} onChange={(e) => setForm({ ...form, subject: e.target.value })} placeholder="Chemistry" className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
          <div><label className="text-xs text-slate-500">Room</label><input value={form.room} onChange={(e) => setForm({ ...form, room: e.target.value })} placeholder="Hall A" className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
          <div><label className="text-xs text-slate-500">Date</label><input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
          <div><label className="text-xs text-slate-500">Time</label><input type="time" value={form.time} onChange={(e) => setForm({ ...form, time: e.target.value })} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
          <div className="col-span-2"><label className="text-xs text-slate-500">Notes (optional)</label><input value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} placeholder="Bring calculator" className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
          <button type="submit" className="col-span-2 bg-amber-400 text-slate-900 font-semibold rounded-md py-2 text-sm"><Plus size={16} /> Add exam</button>
        </form>
      </Card>

      {preview && preview.length > 0 && <Card>
        <div className="flex items-center justify-between mb-3"><p className="text-sm font-medium">Found {preview.length} matching exam{preview.length > 1 ? "s" : ""}</p><button onClick={() => setPreview(null)} className="text-xs text-slate-400">Discard</button></div>
        <div className="space-y-2">{preview.map((r, i) => <div key={r.id} className="flex items-center gap-2 flex-wrap border-b border-slate-100 pb-2">
          <input type="checkbox" checked={r.include} onChange={() => updatePreviewRow(i, { include: !r.include })} />
          <input value={r.subject} onChange={(e) => updatePreviewRow(i, { subject: e.target.value })} className="border rounded px-1.5 py-1 text-xs flex-1 min-w-[110px]" />
          <input type="date" value={r.date} onChange={(e) => updatePreviewRow(i, { date: e.target.value })} className="border rounded px-1.5 py-1 text-xs w-32" />
          <input type="time" value={r.time} onChange={(e) => updatePreviewRow(i, { time: e.target.value })} className="border rounded px-1.5 py-1 text-xs w-24" />
          <input value={r.room} onChange={(e) => updatePreviewRow(i, { room: e.target.value })} placeholder="Room" className="border rounded px-1.5 py-1 text-xs w-20" />
          <input value={r.notes} onChange={(e) => updatePreviewRow(i, { notes: e.target.value })} placeholder="Notes" className="border rounded px-1.5 py-1 text-xs flex-1 min-w-[120px]" />
        </div>)}</div>
        <button onClick={confirmPreview} className="mt-3 w-full bg-amber-400 text-slate-900 font-semibold rounded-md py-2 text-sm">Add {preview.filter((r) => r.include && r.date && r.subject).length} exam{preview.filter((r) => r.include && r.date && r.subject).length === 1 ? "" : "s"}</button>
      </Card>}

      <div className="space-y-2">
        {sorted.length === 0 && <p className="text-sm text-slate-400 text-center py-8">No exams added yet.</p>}
        {sorted.map((ex) => <div key={ex.id} className="flex items-start gap-3 bg-white border border-slate-200 rounded-lg px-4 py-3"><div className="flex-1 min-w-0"><p className="font-medium text-sm">{ex.subject}</p><p className="text-xs text-slate-500">{formatDateReadable(ex.date)} · {formatTime12(ex.time)} · Room {ex.room || "TBA"}</p>{ex.notes && <p className="text-xs text-slate-400 mt-1">{ex.notes}</p>}</div><button onClick={() => removeEntry(ex.id)} className="text-slate-400 hover:text-rose-500"><Trash2 size={16} /></button></div>)}
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
